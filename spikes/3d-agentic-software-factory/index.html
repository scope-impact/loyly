<style>
:root{--bg:#f4f5f2;--surface:#fff;--fg:#1c231f;--muted:#5f6b65;--line:#d6dcd7;--accent:#0e6b5c;--accent-soft:#dcefe9;--cmd:#cfe0fb;--cmd-ink:#1d3f7a;--evt:#fde2bd;--evt-ink:#7a4207;--fail:#f8d4cf;--fail-ink:#7d2418;--rm:#cdeed5;--rm-ink:#1c5a2c;--proc:#e6d9f7;--proc-ink:#4b2a7a;--scr:#e6e9e7;--scr-ink:#2d3833;--warn:#9a5b00;--display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;--body:"Instrument Sans",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#121715;--surface:#1a211e;--fg:#e3e9e5;--muted:#98a59f;--line:#2e3833;--accent:#5cc9b0;--accent-soft:#1d3a33;--cmd:#1e3355;--cmd-ink:#bcd3fb;--evt:#4a3115;--evt-ink:#fcd8a6;--fail:#4a201b;--fail-ink:#f6c3bb;--rm:#1d3d26;--rm-ink:#bfe8c9;--proc:#33264a;--proc-ink:#dccbf5;--scr:#262e2a;--scr-ink:#d3dbd6;--warn:#f0b860;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--bg)}body{margin:0;padding:0 max(14px,env(safe-area-inset-right)) 64px max(14px,env(safe-area-inset-left));background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}body:before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top);z-index:20;background:var(--bg)}a{color:var(--accent)}button{font:inherit}.wrap{max-width:1180px;margin:auto;display:grid;gap:28px}.bar{position:sticky;top:env(safe-area-inset-top);z-index:10;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:center;padding:14px 0 12px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px)}.left,.crumbs,.tabs,.legend,.chips,.row{display:flex;flex-wrap:wrap;align-items:center}.left{gap:8px 14px;min-width:0}.crumbs{gap:4px;font-size:14px}.crumbs a,.crumbs span{padding:3px 8px;border-radius:4px;text-decoration:none}.crumbs a{color:var(--fg);background:var(--surface);border:1px solid var(--line)}.crumbs .here{font-weight:600;color:var(--accent)}.crumbs .sep{padding:0 2px;color:var(--muted)}.tabs{gap:4px}.tabs a{padding:5px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--fg);font:600 13px var(--display);text-decoration:none}.tabs a.on{border-color:var(--accent);background:var(--accent);color:var(--bg)}.legend{gap:6px 12px;color:var(--muted);font-size:11.5px}.legend i{display:inline-block;width:11px;height:11px;margin-right:5px;border-radius:2px;vertical-align:-1px}.head{display:grid;gap:10px;padding-top:10px}.eyebrow,.lbl{color:var(--accent);font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase}h1,h2,h3{margin:0;font-family:var(--display);line-height:1.15;text-wrap:balance}h1{font-size:clamp(30px,4.5vw,44px);letter-spacing:-.02em}h2{font-size:23px}h3{font-size:16px}.muted{color:var(--muted)}p{max-width:78ch;margin:0}.stats{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted);font:12px var(--mono)}.stats b{color:var(--fg);font-weight:500}.note{padding:10px 14px;border-left:3px solid var(--accent);border-radius:0 6px 6px 0;background:var(--surface);font-size:13px}code,.mono{font-family:var(--mono);font-size:.86em}section{display:grid;gap:12px}.frame{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
/* Event-model overview: columns are behavior modules, rows are EventStorm concerns. */
.journey{display:grid;min-width:1740px}.journey>div{min-width:0;padding:10px;border-left:1px dashed var(--line);border-bottom:1px solid var(--line)}.journey .corner,.journey .lane{position:sticky;left:0;z-index:2;border-left:0;background:var(--surface)}.journey .lane{color:var(--muted);font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase}.journey .stage{display:grid;gap:2px}.journey .stage b{font:600 14px var(--display)}.journey .stage a{color:var(--accent);font:11px var(--mono);text-decoration:none}.stack{display:flex;flex-direction:column;align-items:flex-start;gap:5px}.st{display:inline-block;max-width:100%;padding:5px 7px;border-radius:3px;font-size:12px;font-weight:500;line-height:1.3;overflow-wrap:anywhere;text-decoration:none}.st small{display:block;margin-top:2px;opacity:.82;font:10px var(--mono)}.st.cmd{background:var(--cmd);color:var(--cmd-ink)}.st.evt{background:var(--evt);color:var(--evt-ink)}.st.fail{background:var(--fail);color:var(--fail-ink)}.st.rm{background:var(--rm);color:var(--rm-ink)}.st.proc{background:var(--proc);color:var(--proc-ink)}.st.scr{background:var(--scr);color:var(--scr-ink)}a.st:hover,a.st:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.card{display:grid;gap:9px;align-content:start;min-width:0;padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);text-decoration:none}.card:hover,.card:focus-visible{border-color:var(--accent);outline:none;box-shadow:inset 0 0 0 1px var(--accent)}.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.nums div{color:var(--muted);font-size:11px}.nums b{display:block;color:var(--fg);font:600 19px var(--display)}.src{justify-self:start;padding:1px 6px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font:10.5px var(--mono)}
/* Module EventStorm board. */
.storm{display:grid;gap:16px;overflow-x:auto;padding:18px 20px 22px;border:1px solid #c6d0da;border-radius:6px;background:#f1f4f7;color:#1c231f}.storm-flow{display:flex;gap:88px;min-width:max-content;padding:55px 4px 12px}.clu{position:relative;display:grid;width:330px;grid-template-columns:150px 180px;grid-template-areas:"act agg" "cmd evt" "ref ref";align-items:start}.clu:not(:last-child):after{content:"";position:absolute;top:105px;left:100%;width:88px;border-top:3px dashed #6b3fc4}.clu:not(:last-child):before{content:"";position:absolute;z-index:2;top:99px;left:calc(100% + 80px);border:7px solid transparent;border-left-color:#6b3fc4}.sk{display:grid;place-items:center;min-height:52px;padding:8px 10px;border-radius:2px;box-shadow:0 1px 2px #0002;text-align:center;font-size:12px;line-height:1.3;overflow-wrap:anywhere;text-decoration:none}.sk.actor{grid-area:act;min-height:44px;margin-top:4px;border:2px solid #f2c14e;background:#fbf3d5;color:#3a2c06}.sk.agg{grid-area:agg;min-height:44px;background:#f2c14e;color:#3a2c06}.sk.cmd{grid-area:cmd;min-height:70px;background:#4389d6;color:#fff}.facts{grid-area:evt;display:grid}.sk.evt{min-height:70px;background:#d98444;color:#fff}.sk.evt.quiet{min-height:44px;border-top:1px solid #fff6;background:#e9b38c;color:#4a2a10;font-size:11px}.sk small{display:block;margin-top:3px;opacity:.85;font:10px var(--mono)}.refs{grid-area:ref;display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.sk.fail{display:block;min-height:0;border:2px solid #d98444;background:#f8e5da;color:#4a2a10;text-align:left;font-size:11px}.sk.fail b{display:block;font:600 10px var(--mono)}.storm-key{display:flex;flex-wrap:wrap;gap:6px 16px;color:#2d3833;font-size:11.5px}.storm-key i{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-2px}
/* Rules, Gherkin, topology and evidence. */
.specs,.scenarios,.topology,.flows{display:grid;gap:10px}.spec{display:grid;gap:12px;padding:16px 18px;border:1px solid var(--line);border-radius:8px;background:var(--surface);scroll-margin-top:82px}.spec:target{box-shadow:0 0 0 2px var(--accent)}.spec-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px}.spec-h h3{font-size:18px}.spec-grid{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px 16px}.spec-grid>.k{padding-top:4px;color:var(--muted);font:11px var(--mono);letter-spacing:.07em;text-transform:uppercase}.cl{display:inline-block;padding:3px 7px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font:12px var(--mono);overflow-wrap:anywhere}.rqs,.then{display:grid;gap:7px;margin:0;padding:0;list-style:none}.rq{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px}.rq .n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--fail);color:var(--fail-ink);font:600 11px var(--mono)}.then li{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}.verb{min-width:62px;padding:2px 7px;border-radius:3px;background:var(--evt);color:var(--evt-ink);font:600 10px var(--mono);letter-spacing:.06em;text-align:center;text-transform:uppercase}details.source>summary{cursor:pointer;color:var(--muted);font:11px var(--mono)}pre.code{max-width:100%;margin:8px 0 0;padding:12px 14px;overflow:auto;border:1px solid var(--line);border-radius:5px;background:var(--bg);font:11px/1.55 var(--mono);white-space:pre}.scenarios{grid-template-columns:1fr 1fr}.scenario{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}.scenario header{display:flex;justify-content:space-between;gap:10px}.status{height:max-content;padding:2px 6px;border-radius:3px;font:10px var(--mono)}.status.e2e{background:var(--accent-soft);color:var(--accent)}.status.skip{background:var(--fail);color:var(--fail-ink)}.tags{display:flex;flex-wrap:wrap;gap:4px}.tag{padding:1px 5px;border-radius:3px;background:var(--scr);color:var(--scr-ink);font:10px var(--mono)}.gw{display:grid;grid-template-columns:48px 1fr;gap:7px;padding-top:4px;border-top:1px dashed var(--line);font-size:12px}.gw b{color:var(--muted);font:10px var(--mono)}.topology{grid-template-columns:repeat(3,1fr)}.top-col{padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}.top-col h3{margin-bottom:10px}.top-col .st{display:block;margin:5px 0}.flow{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}.flow-path{display:flex;gap:6px;align-items:center;overflow-x:auto}.flow-node{min-width:145px;padding:7px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-size:11px}.arrow{color:var(--muted)}.table-wrap,.mm{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}table{width:100%;min-width:720px;border-collapse:collapse;font-size:12px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font:10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase}.filter{display:flex;flex-wrap:wrap;gap:6px}.filter button{padding:5px 9px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--fg);cursor:pointer}.filter button.on{border-color:var(--accent);background:var(--accent);color:var(--bg)}.mm{position:relative;padding:12px;background:#fff}.mm pre{min-width:760px;margin:0}.mm svg{height:auto;max-height:640px}.mm button{position:absolute;z-index:2;top:8px;right:8px;padding:4px 9px;border:1px solid #c9d2cc;border-radius:5px;background:#fff;color:#1c231f;cursor:pointer}.mm.full svg{max-width:none!important}footer{padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
.wrap{grid-template-columns:minmax(0,1fr)}.bar,main,.head,section,.specs,.spec,.spec-h,.spec-grid,.rq,.cl{min-width:0}.spec{max-width:100%}.spec h3,.cl{overflow-wrap:anywhere}.cl{max-width:100%}
@media(max-width:760px){.legend{display:none}.scenarios,.topology{grid-template-columns:1fr}.spec-grid{grid-template-columns:1fr;gap:4px}.spec-grid>.k{padding-top:8px}.refs{grid-template-columns:1fr}.wrap{gap:22px}.bar{align-items:flex-start}.tabs a{padding:5px 7px}.mm{padding:7px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="left"><nav class="crumbs" id="crumbs" aria-label="Where you are"></nav><nav class="tabs" id="tabs" aria-label="Views"></nav></div>
    <div class="legend"><span><i style="background:var(--scr)"></i>actor</span><span><i style="background:var(--cmd)"></i>command</span><span><i style="background:var(--evt)"></i>event</span><span><i style="background:var(--fail)"></i>refusal</span><span><i style="background:var(--rm)"></i>read model</span><span><i style="background:var(--proc)"></i>policy</span></div>
  </div>
  <main id="view"></main>
  <footer>Generated on 2026-11-05 from <code>.pi/model/*.allium</code>, matching Gherkin under <code>.pi/model/plan/</code>, <code>regeneration_event_model.clj</code>, and the maintained structural views in <code>.pi/architecture.md</code>. The committed model remains authoritative.</footer>
</div>
<script>
let DOMAIN;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const human=s=>String(s??"").split("/").pop().replace(/([a-z0-9])([A-Z])/g,"$1 $2").replace(/[-_]/g," ").replace(/\b\w/g,c=>c.toUpperCase());
const short=s=>String(s??"").split("/").pop();
let MODULES;
const scenariosFor=id=>DOMAIN.scenarios.filter(s=>s.module===id);
let totalRules=0;
let totalRequires=0;
const blocks=k=>Object.entries(DOMAIN.eventModel[k]||{});
const refs=b=>b["grain/allium"]||[];
const linked=(kind,m,r)=>blocks(kind).filter(([,b])=>refs(b).some(x=>String(x.spec||"").endsWith(m.file)&&x.name===r.name));
const trigger=r=>(String(r.when||"").match(/^(\w+)\(/)||[])[1]||r.name;
const actor=(m,r)=>m.surfaces.find(s=>(s.provides||[]).includes(trigger(r)))?.facing||(/Operator|Approve|Preview|Submit|Prepare/.test(r.name)?"Operator":"ORC");
const aggregate=m=>m.entities.find(e=>!e.external)?.name||human(m.id);
const digestValue=value=>{let h=2166136261;for(const c of String(value??"")){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return `fnv1a-${(h>>>0).toString(16).padStart(8,"0")}`};
const reviewAttrs=(id,kind,label,digest,source="")=>` data-review-id="${esc(id)}" data-review-kind="${esc(kind)}" data-review-label="${esc(label)}" data-review-digest="${esc(digest||digestValue(label))}" data-review-source="${esc(source)}" data-review-commit="${esc(DOMAIN.sourceCommit)}" data-review-model="${esc(DOMAIN.modelDigest)}"`;
const st=(kind,label,sub="",href="",review=null)=>{const body=`${esc(human(label))}${sub?`<small>${esc(sub)}</small>`:""}`,attrs=review?reviewAttrs(review.id,review.kind,review.label||human(label),review.digest,review.source):"";return href?`<a class="st ${kind}" href="${href}"${attrs}>${body}</a>`:`<span class="st ${kind}"${attrs}>${body}</span>`};
function crumbs(parts){document.getElementById("crumbs").innerHTML=parts.map((p,i)=>i===parts.length-1?`<span class="here" aria-current="page">${esc(p[0])}</span>`:`<a href="${p[1]}">${esc(p[0])}</a><span class="sep">›</span>`).join("")}
function tabs(active){document.getElementById("tabs").innerHTML=[["model","#model","Event model"],["grain","#grain","Grain"],["c4","#c4","C4"],["review","#review","Review"]].map(([id,href,label])=>`<a class="${active===id?"on":""}" href="${href}">${label}</a>`).join("")}
function stats(){return `<div class="stats"><span><b>${DOMAIN.modules.length}</b> modules</span><span><b>${totalRules}</b> rules</span><span><b>${totalRequires}</b> requires / refusals</span><span><b>${DOMAIN.scenarios.length}</b> examples</span><span><b>${DOMAIN.scenarios.filter(s=>s.status==="e2e").length}</b> active E2E</span><span><b>${DOMAIN.scenarios.filter(s=>s.status==="skip").length}</b> explicit gaps</span></div>`}
function overviewBoard(){
  const cols=`170px repeat(${DOMAIN.modules.length},minmax(185px,1fr))`;
  let html=`<div class="corner"></div>${DOMAIN.modules.map(m=>`<div class="stage"><b>${esc(human(m.id))}</b><a href="#module/${m.id}">open module →</a></div>`).join("")}`;
  const lane=(name,render)=>{html+=`<div class="lane">${name}</div>`+DOMAIN.modules.map(m=>`<div><div class="stack">${render(m)}</div></div>`).join("")};
  lane("Actors / surfaces",m=>[...new Set(m.rules.map(r=>actor(m,r)))].slice(0,6).map(x=>st("scr",x)).join(""));
  lane("Commands",m=>m.rules.slice(0,7).map(r=>st("cmd",trigger(r),r.name,`#rule/${m.id}/${r.name}`)).join(""));
  lane("Events / facts",m=>m.rules.slice(0,7).flatMap(r=>{const ev=linked("events",m,r);return ev.length?ev.map(([k,b])=>st("evt",k,b.description||"")):(r.ensures||[]).slice(0,1).map(x=>st("evt",x))}).join(""));
  lane("Refusals",m=>m.rules.flatMap(r=>r.requires.map((x,i)=>st("fail",x,`${r.name} · ${i+1}`,`#rule/${m.id}/${r.name}`))).slice(0,8).join(""));
  lane("Examples",m=>scenariosFor(m.id).slice(0,7).map(s=>st(s.status==="skip"?"fail":"rm",s.title,s.item?`item ${s.item}`:s.status,`#module/${m.id}`)).join(""));
  return `<div class="frame"><div class="journey" style="grid-template-columns:${cols}">${html}</div></div>`;
}
function moduleCard(m){const sc=scenariosFor(m.id);const refusals=m.rules.reduce((n,r)=>n+r.requires.length,0);const key=m.projectionGap?`gherkin-slice:${m.id}`:`allium:${m.id}`,kind=m.projectionGap?"Gherkin-only slice":"behavior module";return `<a class="card" href="#module/${m.id}"${reviewAttrs(key,kind,human(m.id),m.digest,m.file)}><h3>${esc(human(m.id))}</h3><p class="muted">${esc(m.description||"")}</p><div class="nums"><div><b>${m.rules.length}</b>rules</div><div><b>${refusals}</b>refusals</div><div><b>${sc.length}</b>examples</div><div><b>${m.entities.length}</b>entities</div><div><b>${m.invariants.length}</b>invariants</div><div><b>${m.surfaces.length}</b>surfaces</div></div><span class="src">${m.projectionGap?"Gherkin only · Allium gap":"Allium · Gherkin · Grain"}</span></a>`}
function viewModel(){crumbs([["Pi Harness","#model"]]);tabs("model");document.getElementById("view").innerHTML=`<div class="head"><div class="eyebrow">Level 1 · Pi harness service area</div><h1>Pi Harness, as one event model</h1><p class="muted">Read from left to right or drill into a module. Actors issue commands; rules protect boundaries; facts are recorded; every <code>requires</code> clause remains visible as a refusal. Gherkin examples project the same behavior at an executable public seam.</p>${stats()}<div class="note"><b>Authority stays in the specifications.</b> Pi explores and presents an exact selection. ORC alone executes the approved contract. A builder never declares completion.</div><div class="note"><b>Data stays separate from presentation.</b> This page renders a read-only <code>event-model.json</code> projection. Navigation and filters keep their own transient state and cannot change the model.</div></div><section><h2>The whole behavior</h2><p class="muted">Columns are maintained Allium modules. Rows are EventStorm concerns. This board scrolls inside its frame on smaller screens.</p>${overviewBoard()}</section><section><h2>Drill down by module</h2><div class="cards">${DOMAIN.modules.map(moduleCard).join("")}</div></section>`}
function storm(m){return `<div class="storm"><div class="storm-key"><span><i style="background:#fbf3d5;border:2px solid #f2c14e"></i>actor</span><span><i style="background:#4389d6"></i>command</span><span><i style="background:#f2c14e"></i>consistency boundary</span><span><i style="background:#d98444"></i>event or state fact</span><span><i style="background:#f8e5da;border:1px solid #d98444"></i>refusal</span></div><div class="storm-flow">${m.rules.map(r=>{const base=`allium:${m.id}:rule:${r.name}`,ev=linked("events",m,r);const facts=ev.length?ev.map(([k,b])=>`<span class="sk evt"${reviewAttrs(`grain:events:${k}`,"event",human(k),digestValue(JSON.stringify(b)),".pi/model/regeneration_event_model.clj")}>${esc(human(k))}<small>${esc(b.description||"")}</small></span>`).join(""):(r.ensures.length?r.ensures.slice(0,3):["No durable fact declared here"]).map((x,i)=>`<span class="sk evt quiet"${reviewAttrs(`${base}:effect:${i+1}`,"state effect",x,digestValue(x),m.file)}>${esc(x)}</span>`).join("");return `<div class="clu"><span class="sk actor"${reviewAttrs(`${base}:actor`,"actor",human(actor(m,r)),r.digest,m.file)}>${esc(human(actor(m,r)))}</span><span class="sk agg"${reviewAttrs(`${base}:boundary`,"consistency boundary",aggregate(m),m.digest,m.file)}>${esc(aggregate(m))}</span><a class="sk cmd" href="#rule/${m.id}/${r.name}"${reviewAttrs(base,"rule command",r.name,r.digest,m.file)}>${esc(human(linked("commands",m,r)[0]?.[0]||trigger(r)))}<small>${esc(r.name)}</small></a><div class="facts">${facts}</div><div class="refs">${r.requires.map((x,i)=>`<a class="sk fail" href="#rule/${m.id}/${r.name}"${reviewAttrs(`${base}:requires:${r.requirementDigests?.[i]||digestValue(x)}`,"refusal",`Refusal ${i+1}: ${x}`,r.requirementDigests?.[i]||digestValue(x),m.file)}><b>Refusal ${i+1}</b>${esc(x)}</a>`).join("")}</div></div>`}).join("")}</div></div>`}
function scenarioCard(s){const identity=s.item?`item:${s.item}:${digestValue(s.title)}`:`scenario:${digestValue(s.title)}`;return `<article class="scenario"${reviewAttrs(`gherkin:${s.module}:${identity}`,"acceptance example",s.title,s.digest,s.file)}><header><h3>${esc(s.title)}</h3><span class="status ${s.status}">${esc(s.status)}</span></header><div class="tags">${s.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>${s.steps.map(line=>{const [kw,...rest]=line.split(" ");return `<div class="gw"><b>${esc(kw)}</b><span>${esc(rest.join(" "))}</span></div>`}).join("")}<div class="muted mono">${esc(s.file)}${s.rule?` · Rule: ${esc(s.rule)}`:""}</div></article>`}
function ruleCard(m,r){const base=`allium:${m.id}:rule:${r.name}`;return `<article class="spec" id="r-${esc(r.name)}"${reviewAttrs(base,"Allium rule",r.name,r.digest,m.file)}><div class="spec-h"><h3>${esc(r.name)}</h3><span class="src">${r.requires.length} refusals · ${r.ensures.length} effects</span></div><div class="spec-grid"><div class="k">When</div><div><code class="cl">${esc(r.when||"")}</code></div><div class="k">Only if</div><ol class="rqs">${r.requires.map((x,i)=>`<li class="rq"${reviewAttrs(`${base}:requires:${r.requirementDigests?.[i]||digestValue(x)}`,"refusal",`Refusal ${i+1}: ${x}`,r.requirementDigests?.[i]||digestValue(x),m.file)}><span class="n">${i+1}</span><code class="cl">${esc(x)}</code></li>`).join("")||`<li class="muted">No refusal declared.</li>`}</ol><div class="k">Then</div><ul class="then">${r.ensures.map((x,i)=>`<li${reviewAttrs(`${base}:effect:${i+1}`,"rule effect",x,digestValue(x),m.file)}><span class="verb">records</span><code class="cl">${esc(x)}</code></li>`).join("")}</ul></div><details class="source"><summary>Allium source · ${esc(m.file)}</summary><pre class="code">${esc(r.source)}</pre></details></article>`}
function linkedTopology(m){const kinds=[["commands","Commands","cmd"],["events","Events","evt"],["read-models","Read models","rm"],["queries","Queries","rm"],["todo-processors","Policies","proc"],["screens","Screens","scr"]];return `<div class="topology">${kinds.map(([kind,label,cls])=>{const xs=blocks(kind).filter(([,b])=>refs(b).some(x=>String(x.spec||"").endsWith(m.file)));return `<div class="top-col"><h3>${label} <span class="muted">${xs.length}</span></h3>${xs.map(([k,b])=>st(cls,k,b.description||"","",{id:`grain:${kind}:${k}`,kind:label.slice(0,-1).toLowerCase(),label:human(k),digest:digestValue(JSON.stringify(b)),source:".pi/model/regeneration_event_model.clj"})).join("")||`<span class="muted">No linked block.</span>`}</div>`}).join("")}</div>`}
function viewModule(id,ruleName){const m=MODULES[id];if(!m)return viewModel();crumbs([["Pi Harness","#model"],[human(m.id),`#module/${m.id}`]]);tabs("model");const gap=m.projectionGap?`<div class="note"><b>Visible modeling gap.</b> This stamped Gherkin slice has no matching Allium module, so no command/event storm is inferred.</div>`:"";document.getElementById("view").innerHTML=`<div class="head"><div class="eyebrow">Level 2 · ${m.projectionGap?"Gherkin-only slice":"behavior module"} · ${esc(m.file)}</div><h1>${esc(human(m.id))}</h1><p class="muted">${esc(m.description||"")}</p>${gap}<div class="stats"><span><b>${m.rules.length}</b> rules</span><span><b>${m.rules.reduce((n,r)=>n+r.requires.length,0)}</b> refusals</span><span><b>${m.entities.length}</b> entities</span><span><b>${m.invariants.length}</b> invariants</span><span><b>${scenariosFor(m.id).length}</b> examples</span></div></div><section><h2>Event storm</h2><p class="muted">The behavioral path from actor and command through the protected boundary to facts and explicit refusals.</p>${storm(m)}</section><section><h2>When · Only if · Then</h2><div class="specs">${m.rules.map(r=>ruleCard(m,r)).join("")}</div></section><section><h2>Executable examples</h2><p class="muted">Active E2E and explicitly skipped examples remain in the same denominator.</p><div class="scenarios">${scenariosFor(m.id).map(scenarioCard).join("")||`<div class="note">No matching feature file.</div>`}</div></section><section><h2>Linked Grain topology</h2><p class="muted">Only blocks whose <code>:grain/allium</code> metadata points back to this module are shown.</p>${linkedTopology(m)}</section>`;if(ruleName)setTimeout(()=>{const el=document.getElementById(`r-${ruleName}`);el?.scrollIntoView({block:"start"})},0)}
function viewGrain(){crumbs([["Pi Harness","#model"],["Grain topology","#grain"]]);tabs("grain");const kinds=[["commands","Commands","cmd"],["events","Events / durable facts","evt"],["read-models","Read models","rm"],["queries","Queries","rm"],["todo-processors","Policies / processors","proc"],["screens","Screens","scr"]];document.getElementById("view").innerHTML=`<div class="head"><div class="eyebrow">Supporting view · regeneration_event_model.clj</div><h1>Commands become facts, then projections</h1><p class="muted">Grain supplies durable command, event and projection topology. It does not replace ORC workflow authority or duplicate product behavior.</p></div><section><div class="topology">${kinds.map(([k,l,c])=>`<div class="top-col"><h3>${l} <span class="muted">${blocks(k).length}</span></h3>${blocks(k).map(([id,b])=>st(c,id,b.description||"","",{id:`grain:${k}:${id}`,kind:l,label:human(id),digest:digestValue(JSON.stringify(b)),source:".pi/model/regeneration_event_model.clj"})).join("")}</div>`).join("")}</div></section><section><h2>Named flows</h2><div class="flows">${blocks("flows").map(([id,f])=>`<article class="flow"${reviewAttrs(`grain:flow:${id}`,"Grain flow",human(id),digestValue(JSON.stringify(f)),".pi/model/regeneration_event_model.clj")}><h3>${esc(human(id))}</h3><p class="muted">${esc(f.description||"")}</p>${(f.steps||[]).map(s=>`<div class="flow-path"><span class="flow-node"><b>${esc(s.from?.[0]||"")}</b><br>${esc(human(s.from?.[1]||""))}</span><span class="arrow">→</span><span class="flow-node"><b>${esc(s.to?.[0]||"")}</b><br>${esc(human(s.to?.[1]||""))}</span></div>`).join("")}</article>`).join("")}</div></section>`}
async function renderMermaid(){if(!window.mermaid)return;mermaid.initialize({startOnLoad:false,securityLevel:"strict",theme:"base",flowchart:{htmlLabels:true,useMaxWidth:true}});await mermaid.run({querySelector:"pre.mermaid"})}
function viewC4(){crumbs([["Pi Harness","#model"],["C4 evidence","#c4"]]);tabs("c4");document.getElementById("view").innerHTML=`<div class="head"><div class="eyebrow">Supporting structural evidence · .pi/architecture.md</div><h1>System boundary and containers</h1><p class="muted">These maintained structural views locate the behavior. EventStorm remains the behavioral source; C4 explains where that behavior runs.</p></div>${DOMAIN.c4.map((d,i)=>`<section${reviewAttrs(`c4:view:${digestValue(d.title)}`,"C4 view",d.title,d.digest,".pi/architecture.md")}><h2>${esc(d.title)}</h2><div class="mm"><button type="button" data-size="${i}">Actual size</button><pre class="mermaid">${esc(d.source)}</pre></div></section>`).join("")}`;renderMermaid().then(()=>document.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{const box=b.closest(".mm");box.classList.toggle("full");b.textContent=box.classList.contains("full")?"Fit to width":"Actual size"}))}
let reviewFilter="all";
function viewReview(){crumbs([["Pi Harness","#model"],["Review","#review"]]);tabs("review");const filtered=DOMAIN.scenarios.filter(s=>reviewFilter==="all"||s.status===reviewFilter);document.getElementById("view").innerHTML=`<div class="head"><div class="eyebrow">Complete denominator · evidence and gaps</div><h1>Progress without hidden gaps</h1><p class="muted">Filtering changes the view, never the denominator. Failed, missing, skipped and incomplete behavior remains visible.</p>${stats()}</div><section><h2>Acceptance inventory</h2><div class="filter">${[["all","All"],["e2e","Active E2E"],["skip","Explicit skip"]].map(([v,l])=>`<button class="${reviewFilter===v?"on":""}" data-filter="${v}">${l}</button>`).join("")}</div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Module</th><th>Scenario</th><th>State</th></tr></thead><tbody>${filtered.map(s=>`<tr><td>${esc(s.item||"—")}</td><td><a href="#module/${s.module}">${esc(human(s.module))}</a></td><td>${esc(s.title)}</td><td><span class="status ${s.status}">${esc(s.status)}</span></td></tr>`).join("")}</tbody></table></div></section><section><h2>Slice coverage and reference evidence</h2><div class="table-wrap"><table><thead><tr><th>Slice</th><th>Coverage</th><th>Reference or gap</th></tr></thead><tbody>${DOMAIN.conformance.map(x=>`<tr><td>${esc(x.item)}</td><td>${esc(x.status)}</td><td>${esc(x.note)}</td></tr>`).join("")}</tbody></table></div></section>`;document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{reviewFilter=b.dataset.filter;viewReview()})}
function route(){const p=(location.hash||"#model").slice(1).split("/");scrollTo(0,0);if(p[0]==="module")viewModule(p[1]);else if(p[0]==="rule")viewModule(p[1],p[2]);else if(p[0]==="grain")viewGrain();else if(p[0]==="c4")viewC4();else if(p[0]==="review")viewReview();else viewModel()}
const deepFreeze=value=>{if(value&&typeof value==="object"&&!Object.isFrozen(value)){Object.freeze(value);Object.values(value).forEach(deepFreeze)}return value};
async function boot(){
  const response=await fetch(new URL("event-model.json",location.href),{headers:{Accept:"application/json"}});
  if(!response.ok)throw new Error(`Event model unavailable (${response.status})`);
  DOMAIN=deepFreeze(await response.json());
  MODULES=Object.fromEntries(DOMAIN.modules.map(m=>[m.id,m]));
  totalRules=DOMAIN.modules.reduce((n,m)=>n+m.rules.length,0);
  totalRequires=DOMAIN.modules.reduce((n,m)=>n+m.rules.reduce((x,r)=>x+r.requires.length,0),0);
  addEventListener("hashchange",route);
  route();
}
boot().catch(error=>{document.getElementById("view").innerHTML=`<div class="head"><div class="eyebrow">Data boundary</div><h1>The event model could not be loaded</h1><p class="note">${esc(error.message)}. Serve this directory over HTTP so presentation can read <code>event-model.json</code>.</p></div>`});
</script>
</body>
</html>
