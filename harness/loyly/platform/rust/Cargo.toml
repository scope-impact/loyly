# The offline Rust library set. Candidates may depend on any of these crates at these
# versions; every crate is vendored in the image and nothing else resolves offline.
[package]
name = "platform"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "=0.8.4"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
tokio = { version = "=1.47.1", features = ["full"] }

[dev-dependencies]
reqwest = { version = "=0.12.23", default-features = false, features = ["json", "rustls-tls"] }
