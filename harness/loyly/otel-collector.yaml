receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318
processors:
  batch:
    timeout: 1s
exporters:
  file/traces:
    path: ${env:OTEL_FILE_EXPORT_DIR}/traces.jsonl
    format: json
    create_directory: true
  file/metrics:
    path: ${env:OTEL_FILE_EXPORT_DIR}/metrics.jsonl
    format: json
    create_directory: true
service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/traces]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/metrics]
