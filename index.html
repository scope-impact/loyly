est\n    requires: attempts.all(a => a.target_stack = independently_detected_supported_stack(\n        cycle, a.subject_digest\n    ))\n    requires: every_failed_attempt_seeds_next_candidate(attempts)\n    requires: every_failed_attempt_evidence_is_read_only_to_next_builder(attempts)\n    requires: grade_and_oracle_evidence_hidden_from_every_builder(attempts)\n    requires: every_repair_attempt_has_builder_session(attempts)\n    requires: exists InstrumentationRecord{\n        cycle: cycle,\n        subject_digest: final_subject_digest\n    }\n    ensures: cycle.stage = collect_evidence\n}","when":"VerificationRepairCompleted(cycle, attempts, final_subject_digest)","requires":["cycle.status = running","cycle.stage = repair_verification","attempts.count >= 1","attempts.count <= 3","attempts.last.passed","attempts.last.subject_digest = final_subject_digest","attempts.all(a => a.target_stack = independently_detected_supported_stack(","every_failed_attempt_seeds_next_candidate(attempts)","every_failed_attempt_evidence_is_read_only_to_next_builder(attempts)","grade_and_oracle_evidence_hidden_from_every_builder(attempts)","every_repair_attempt_has_builder_session(attempts)","exists InstrumentationRecord{"],"ensures":["cycle.stage = collect_evidence"]},{"name":"CollectPipelineProductEvidence","source":"rule CollectPipelineProductEvidence {\n    when: IndependentProductEvidenceCollected(cycle, evidence_items)\n    requires: cycle.status = running\n    requires: cycle.stage = collect_evidence\n    requires: evidence_items.count > 0\n    requires: evidence_items.all(e => e.item_identity in cycle.approved_items)\n    requires: evidence_items.all(e => e.subject_digest = instrumented_subject_digest(cycle))\n    ensures:\n        for item in evidence_items:\n            CollectedProductEvidence.created(\n                cycle: cycle,\n                item_identity: item.item_identity,\n                producer: item.producer,\n                evidence: item.evidence,\n arisonReturned(cycle, observations)","requires":["cycle.status = running","cycle.stage = compare_oracle","observations.count > 0","observations.all(o => o.item_identity in cycle.approved_items)","observations.all(o => o.subject_digest = instrumented_subject_digest(cycle))","observations.all(o => o.oracle_digest = combined_oracle_digest("],"ensures":["for observation in observations:","cycle.stage = instrument_conformance"]},{"name":"EvaluatePipelineInstrumentConformance","source":"rule EvaluatePipelineInstrumentConformance {\n    when: IndependentInstrumentConformanceReturned(cycle, observations, passed)\n    requires: cycle.status = running\n    requires: cycle.stage = instrument_conformance\n    requires: observations.count > 0\n    requires: observations.all(o => o.item_identity in cycle.approved_items)\n    requires: observations.all(o => o.subject_digest = instrumented_subject_digest(cycle))\n    ensures: InstrumentConformanceEvaluation.created(\n        cycle: cycle,\n        producer: \"runtime-instrument-conformance\",\n        passed: passed,\n        item_results: observations\n    )\n    ensures: cycle.stage = record_cycle\n}","when":"IndependentInstrumentConformanceReturned(cycle, observations, passed)","requires":["cycle.status = running","cycle.stage = instrument_conformance","observations.count > 0","observations.all(o => o.item_identity in cycle.approved_items)","observations.all(o => o.subject_digest = instrumented_subject_digest(cycle))"],"ensures":["InstrumentConformanceEvaluation.created(","cycle.stage = record_cycle"]},{"name":"RecordPipelineMeasurement","source":"rule RecordPipelineMeasurement {\n    when: ReducePipelineMeasurement(cycle)\n    requires: cycle.status = running\n    requires: cycle.stage = record_cycle\n    let reached = PipelineObservations where cycle = cycle and reached\n    let passed_items = reached where verdict = pass\n    let total = cycle.approved_items.count\n    ensures: PipelineMeasurement.created(\n        cycle: cycle,\n        total: total,\n        passed: passed_items.count,\n        failed: total - passed_items.count,\n        complete: reached.count = total,\n        item_results: results_for_every_approved_item(cycle, reached)\n    )\n    ensures: cycle.stage = result\n}","when":"ReducePipelineMeasurement(cycle)","requires":["cycle.status = running","cycle.stage = record_cycle"],"ensures":["PipelineMeasurement.created(","cycle.stage = result"]},{"name":"PassPipelineCycle","source":"rule PassPipelineCycle {\n    when: DerivePipelineResult(cycle)\n    requires: cycle.status = running\n    requires: cycle.stage = result\n    requires: cycle_measurement(cycle).complete\n    requires: cycle_measurement(cycle).failed = 0\n    requires: instrument_conformance(cycle).passed\n    requires: latest_affordance_conformance(cycle).passed\n    ensures: cycle.status = passed\n}","when":"DerivePipelineResult(cycle)","requires":["cycle.status = running","cycle.stage = result","cycle_measurement(cycle).complete","cycle_measurement(cycle).failed = 0","instrument_conformance(cycle).passed","latest_affordance_conformance(cycle).passed"],"ensures":["cycle.status = passed"]},{"name":"FailPipelineStage","source":"rule FailPipelineStage {\n    when: PipelineStageDidNotSucceed(cycle, stage, failure_kind, reason)\n    requires: cycle.status = running\n    requires: cycle.stage = stage\n    ensures: cycle.status = failed\n    ensures: cycle.failure_stage = stage\n    ensures: cycle.failure_kind = failure_kind\n    ensures: cycle.failure_reason = reason\n    ensures: FailedDenominatorPreserved(cycle: cycle, item_identities: cycle.approved_items)\n}","when":"PipelineStageDidNotSucceed(cycle, stage, failure_kind, reason)","requires":["cycle.status = running","cycle.stage = stage"],"ensures":["cycle.status = failed","cycle.failure_stage = stage","cycle.failure_kind = failure_kind","cycle.failure_reason = reason","FailedDenominatorPreserved(cycle: cycle, item_identities: cycle.approved_items)"]},{"name":
