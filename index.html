p","tags":["@item-01-044","@skip"],"steps":["Given a Fresh Slice Generation Cycle is running for an approved selection","When the builder produces workspace output and independent verification passes","And ORC asks a fresh oracle-author agent to derive one cycle oracle from only the selected Gherkin and public calibration protocol","And the author cannot read candidate files, builder transcripts, verifier evidence, prior verdicts, or host credentials","And the cycle oracle contains the black-box grader and every applicable affordance and runtime-conformance evaluator","And ORC calibrates the cycle oracle against carried and uncarried behavior and seals its binding digest","And the sealed cycle oracle grades every approved item through the public seam","And every item passes with complete evidence","And instrument conformance passes for the same candidate subject","Then ORC normalizes the evidence without timestamps, random identities, or transport noise","And ORC records a proposed oracle bound to the selection and scenario digests","And the proposal records the candidate subject, complete denominator, evidence digest, and judge identity","And generation waits for manual approval without publishing an oracle or recording a promotable candidate"]},{"file":"model/pi-harness/fresh-slice-generation.feature","module":"fresh-slice-generation","rule":"Fresh Slice Generation becomes measured only through approved oracle promotion","title":"Manual approval promotes exactly the reviewed oracle evidence","item":"01-052","status":"skip","tags":["@item-01-052","@skip"],"steps":["Given a successful first grade produced a proposed oracle with a stable digest","When the operator approves that exact proposal digest","Then the independent publisher publishes the normalized evidence as an immutable product-oracle OCI artifact","And Grain records the proposal digest, descriptor digest, selection, scenarios, candidate subject, and approving operator","And the generated candidate is recorded with disposition baseline-measured","And later regeneration uses that descriptor as its comparison oracle","But approval with a stale or different digest is refused"]},{"file":"model/pi-harness/fresh-slice-generation.feature","module":"fresh-slice-generation","rule":"Fresh Slice Generation becomes measured only through approved oracle promotion","title":"Failed or incomplete first grading cannot produce an oracle","item":"01-053","status":"skip","tags":["@item-01-053","@skip"],"steps":["Given a Fresh Slice Generation Cycle has passed independent verification","When any approved item fails, is missing, is inconclusive, or lacks evidence","Then no oracle proposal is approvable","And no product oracle is published","And no baseline-measured candidate is recorded","And the failed denominator and evidence remain visible for diagnosis"]},{"file":"model/pi-harness/fresh-slice-generation.feature","module":"fresh-slice-generation","rule":"Fresh Slice Generation becomes measured only through approved oracle promotion","title":"Failed independent evaluation can only request another clean sample","item":"01-055","status":"skip","tags":["@item-01-055","@skip"],"steps":["Given a Fresh Slice Generation Cycle has produced a verified candidate","When baseline grading or instrument conformance fails","Then ORC may continue by starting a fresh builder session from the approved cut","And the builder receives no candidate workspace, grader evidence, or instrument evidence","And the new candidate receives its own bounded verification-repair loop","And only a candidate that passes that loop is independently evaluated from the beginning","And Grade reuses the cycle oracle sealed for that cut, selection digest, harness snapshot, and oracle-author model","But the failed evaluation cannot enter any builder or verification-repair prompt"]},{"file":"model/pi-harness/fresh-slice-generation.feature","module":"fresh-slice-generation","rule":"Fresh Slice Generation becomes measured only through approved oracle promotion","title":"Fresh Slice Generation keeps repairing until verification passes","item":"01-048","status":"skip","tags":["@item-01-048","@skip"],"steps":["Given a Fresh Slice Generation Cycle has produced a candidate that fails independent verification","When verification returns its evidence to ORC","Then ORC starts a fresh Gondolin builder session from that candidate","And the repair builder receives only verifier evidence","And ORC verifies the repaired candidate again","And no Grade, cycle oracle, or oracle proposal runs while verification still fails"]},{"file":"model/pi-harness/fresh-slice-generation.feature","module":"fresh-slice-generation","rule":"Fresh Slice Generation becomes measured only through approved oracle promotion","title":"Fresh Slice Generation fails when the builder produces no candidate","item":"01-045","status":"skip","tags":["@item-01-045","@skip"],"steps":["Given a Fresh Slice Generation Cycle is running for an approved selection","When the builder produces no workspace output","Then generation fails with the builder failure recorded","And no candidate, oracle proposal, or passing measurement is recorded"]},{"file":"model/pi-harness/fresh-slice-generation.feature","module":"fresh-slice-generation","rule":"Captured evidence is not an oracle until manually approved","title":"Unapproved generation evidence cannot become an oracle or measured candidate","item":"01-046","status":"skip","tags":["@item-01-046","@skip"],"steps":["Given a successful first grade produced a proposed oracle","When a caller requests its use before the operator approves the exact proposal digest","Then the request is refused","And the evidence remains a proposal rather than an accepted product oracle","And the generation candidate cannot be routed as a measured parent"]},{"file":"model/pi-harness/fresh-slice-generation.feature","module":"fresh-slice-generation","rule":"Regeneration compares against the promoted oracle","title":"An explicitly requested regeneration uses the named persisted component candidate","item":"01-047","status":"skip","tags":["@item-01-047","@skip"],"steps":["Given an approved selection for a project component","And a named baseline-measured candidate with a persisted output root and subject digest exists","And the accepted promoted product oracle and sealed harness snapshot are pinned","When the operator explicitly submits Regenerate with that candidate as parent","Then ORC persists a regeneration route with the named candidate as parent","And the builder receives that candidate root and verifies its digest before use","And independent evidence collection compares the regenerated candidate with the promoted oracle","And instrument conformance runs in the regeneration workflow"]},{"file":"model/pi-harness/harness-bootstrap.feature","module":"harness-bootstrap","rule":"The Makefile builds and verifies all configured Gondolin runtimes without oracles","title":"make bootstrap builds every harness and supported-stack runtime","item":"01-047","status":"skip","tags":["@item-01-047","@skip"],"steps":["Given the repository checkout and its harness runtime configurations","And no product oracle or instrument oracle is available","When the operator runs make -C harness bootstrap","Then npm dependencies are installed in .pi/harness","And Docker builds TypeScript, Rust, Java, Rails, cut, instrument, and grader images","And Gondolin builds the corresponding runtime assets under .pi/harness/.state/assets","And every generated runtime asset is verified","And bootstrap records one manifest binding the harness revision, runtime assets, calibration fixtures, and generic conformance machinery","And carried and uncarried harness calibration passes before that manifest is sealed","And no oracle reference or regeneration state is changed"]},{"file":"model/pi-harness/harness-bootstrap.feature","module":"harness-bootstrap","rule":"Harness bootstrap does not build or grade the product","title":"make bootstrap does not run Löyly application or oracle workflows","item":"01-048","status":"skip","tags":["@item-01-048","@skip"],"steps":["Given the operator runs make -C harness bootstrap","When bootstrap completes","Then it has not built or modified the Löyly implementation","And it has not authored a cycle oracle or resolved or published a product oracle","And it has not submitted a regeneration cycle"]},{"file":"model/pi-harness/harness-bootstrap.feature","module":"harness-bootstrap","rule":"Bootstrap failure is surfaced to the operator","title":"An invalid runtime build fails the Makefile target","item":"01-049","status":"skip","tags":["@item-01-049","@skip"],"steps":["Given Docker or Gondolin cannot build or verify a configured runtime","When the operator runs make -C harness bootstrap","Then make exits unsuccessfully with the failing command visible","And no successful bootstrap is reported"]},{"file":"model/pi-harness/operator-control-plane.feature","module":"operator-control-plane","rule":"The Pi harness is a strictly validated Grain service area inside ORC","title":"Startup refuses a harness topology that differs from its Grain Event Model","item":"01-043","status":"skip","tags":["@item-01-043","@skip"],"steps":["Given ORC and the Pi harness have loaded their registered Grain service areas","When the shared Grain runtime starts the Pi harness","Then strict validation reconciles every harness command, event, read model, query, processor, schema, and edge","And missing, extra, or mismatched runtime blocks prevent startup","And CI also resolves every required Grain-to-Allium trace link"]},{"file":"model/pi-harness/operator-control-plane.feature","module":"operator-control-plane","rule":"The Pi harness is a strictly validated Grain service area inside ORC","title":"Public harness operations use Grain commands and queries","item":"01-044","status":"skip","tags":["@item-01-044","@skip"],"steps":["Given the Pi harness is running inside ORC's tenant-scoped Grain runtime","When an operator changes or reads harness state","Then every state change passes through a registered Grain command and event","And every public read passes through a registered Grain query over a read model","And no public operation appends a bare event or reads the event store directly"]},{"file":"model/pi-harness/operator-control-plane.feature","module":"operator-control-plane","rule":"The Pi harness is a strictly validated Grain service area inside ORC","title":"Harness progress is projected from authoritative ORC events","item":"01-045","status":"skip","tags":["@item-01-045","@skip"],"steps":["Given an approved cycle is executing through ORC","When ORC records tree and node execution events","Then the harness progress read model projects the current stage and builder-session reference","And reconnecting clients read that projection through a Grain query","And the harness emits no duplicate progress event"]},{"file":"model/pi-harness/operator-control-plane.feature","module":"operator-control-plane","rule":"Every public operation refuses malformed or conflicting identities","title":"An LLM proposes a reviewable slice but cannot approve it","item":"01-041","status":"skip","tags":["@item-01-041","@skip"],"steps":["Given an operator describes the behavior to regenerate against a prepared cut","When an exploratory Pi, Codex, or other operator session inspects the cut composition and asks the LLM to propose a slice","Then every proposed slice and item identity is resolved from that cut","And invented, missing, duplicate, or ambiguous identities are refused","And the resolved selection is recorded as awaiting approval","And a durable session may retain its transcript, skills, tool calls, and branches","But that transcript is not part of the approved execution contract","And no generation or regeneration starts until the operator approves its exact digest"]},{"file":"model/pi-harness/operator-control-plane.feature","module":"operator-control-plane","rule":"Every public operation refuses malformed or conflicting identities","title":"Cut preparation refuses an invalid or colliding identity","item":"01-015","status":"skip","tags":["@item-01-015","@skip"],"steps":["Given a cut request does not name a full source commit or supported backend","When the operator prepares the source cut","Then the request is refused before a cut task starts","And an existing cut identity is never replaced by different content"]},{"file":"model/pi-harness/operator-control-plane.feature","module":"operator-control-plane","rule":"Every public operation refuses malformed or conflicting identities","title":"Selection preview refuses an empty or ambiguous denominator","item":"01-016","status":"e2e","tags":["@item-01-016","@e2e"],"steps":["Given the requested slice has missing, duplicate, unstamped, or unknown items","When the operator previews the selection","Then no selection contract is recorded","And the refusal identifies the unresolved denominator"]},{"file":"model/pi-harness/operator-control-plane.feature","module":"operator-control-plane","rule":"Every public operation refuses malformed or conflicting identities","title":"Submission refuses an unsafe candidate scope","item":"01-017","status":"skip","tags":["@item-01-017","@skip"],"steps":["Given an approved selection","When submission names an empty, absolute, escaping, or overlapping candidate scope","Then submission is refused before a builder room opens"]},{"file":"model/pi-harness/operator-control-plane.feature","module":"operator-control-plane","rule":"Workflow tasks have observable terminal outcomes","title":"Waiting for a known task returns its one terminal outcome","item":"01-018","status":"e2e","tags":["@item-01-018","@e2e"],"steps":["Given a source-cut, generation, or regeneration task receipt was returned","When the operator waits for its task identity","Then the result is completed or failed with the ORC trace summary","And waiting again returns the same terminal outcome"]},{"file":"model/pi-harness/operator-control-plane.feature","module":"operator-control-plane","rule":"Workflow tasks have observable terminal outcomes","title":"Waiting refuses an unknown task identity","item":"01-019","status":"e2e","tags":["@item-01-019","@e2e"],"steps":["Given no task receipt has the supplied identity","When the operator waits for that identity","Then the request is refused without starting new work"]},{"file":"model/pi-harness/operator-control-plane.feature","module":"operator-control-plane","rule":"Workflow tasks have observable terminal outcomes","title":"A durable task remains observable after worker restart","item":"01-020","status":"skip","tags":["@item-01-020","@skip"],"steps":["Given an ORC task receipt was returned before the worker stopped","When a replacement worker waits for the task identity","Then it reconstructs the task outcome from durable ORC state","And it does not rerun the task to manufacture an answer"]},{"file":"model/pi-harness/operator-control-plane.feature","module":"operator-control-plane","rule":"The reviewed preparation binds every cycle-defining choice","title":"Approval binds the complete cycle preparation and diagram","item":"01-035","status":"skip","tags":["@item-01-035","@skip"],"steps":["Given an approved slice selection","When an operator session prepares a cycle with scope, target stack, execution profile, pinned inputs, and outer-cycle budget","Then the harness returns a deterministic preparation diagram and digest","And approval accepts only that exact preparation digest","And changing any bound field requires a new preparation"]},{"file":"model/pi-harness/operator-control-plane.feature","module":"operator-control-plane","rule":"The reviewed preparation binds every cycle-defining choice","title":"Oracle promotion requires manual approval of the exact proposal digest","item":"01-054","status":"skip","tags":["@item-01-054","@skip"],"steps":["Given a complete passing first grade produced an oracle proposal awaiting approval","When an operator manually approves its exact proposal digest","Then the control plane requests immutable publication of that proposal","And a stale or different digest is refused","And no accepted product oracle exists before publication succeeds"]},{"file":"model/pi-harness/operator-control-plane.feature","module":"operator-control-plane","rule":"Any operator session can drive the outer lifecycle","title":"The control plane does not depend on one interactive session implementation","item":"01-036","status":"skip","tags":["@item-01-036","@skip"],"steps":["Given a Codex, Pi, or other authorized operator session","When it supplies an immutable approved fixed execution contract through the public control plane","Then ORC starts the same regeneration cycle contract","And ORC owns its bounded prompt, tool surface, retries, termination, and result","And disconnecting that session does not stop the internal ORC cycle"]},{"file":"model/pi-harness/operator-control-plane.feature","module":"operator-control-plane","rule":"Any operator session can drive the outer lifecycle","title":"Live progress reconciles with durable ORC execution state","item":"01-037","status":"skip","tags":["@item-01-037","@skip"],"steps":["Given a cycle is running and ORC emits stage notifications","When the observing extension connects or reconnects","Then it displays the current stage and associated builder-session reference","And it queries ORC execution state to recover from missing notifications","And the progress view never becomes workflow authority"]},{"file":"model/pi-harness/operator-control-plane.feature","module":"operator-control-plane","rule":"Builder sessions are observable without weakening independence","title":"An operator observes a builder session read-only","item":"01-038","status":"e2e","tags":["@item-01-038","@e2e"],"steps":["Given ORC opened a separately identified builder session for one build attempt","When an operator session opens that builder-session reference","Then it can inspect committed model turns, tool calls, workspace generation, and progress","But observation cannot change the builder transcript or candidate","And the builder cannot read the operator transcript or independent grader evidence"]},{"file":"model/pi-harness/operator-control-plane.feature","module":"operator-control-plane","rule":"Builder sessions are observable without weakening independence","title":"Intervention is explicit and provenance-recorded","item":"01-039","status":"skip","tags":["@item-01-039","@skip"],"steps":["Given a builder session is active or completed","When an operator pauses, steers, or forks its work","Then the action occurs only at a safe boundary or in a distinct fork","And the resulting candidate is marked as assisted","And a completed builder session is never silently mutated"]},{"file":"model/pi-harness/operator-control-plane.feature","module":"operator-control-plane","rule":"Builder sessions are observable without weakening independence","title":"A builder transcript is restored with its matching workspace generation","item":"01-040","status":"skip","tags":["@item-01-040","@skip"],"steps":["Given a builder session committed model turns and VM tool results","When its host or execution room restarts","Then the session resumes from the workspace generation bound to those committed results","And an uncommitted VM mutation is discarded or replayed from the previous generation","And transcript state is never restored against a mismatched workspace"]},{"file":"model/pi-harness/project-vm-config.feature","module":"project-vm-config","rule":"A selected project resolves its own VM and target-stack build files by convention","title":"Löyly resolves its Gondolin config and Dockerfile for each supported stack","item":"01-050","status":"skip","tags":["@item-01-050","@skip"],"steps":["Given the selected project is loyly","When the harness resolves its project runtime files","Then its Gondolin VM config is harness/loyly/gondolin.json","And its TypeScript, Rust, Java, and Rails Dockerfiles are harness/loyly/Dockerfile.<stack>","And each selected target stack uses only its own Dockerfile"]},{"file":"model/pi-harness/project-vm-config.feature","module":"project-vm-config","rule":"Missing project runtime config fails closed","title":"An unsupported or missing project stack Dockerfile is refused","item":"01-051","status":"skip","tags":["@item-01-051","@skip"],"steps":["Given the selected project has no Dockerfile for the requested target stack","When the harness resolves its project runtime files","Then resolution fails before a Gondolin VM starts","And no other project's Dockerfile is substituted"]},{"file":"model/pi-harness/prompt-optimization.feature","module":"prompt-optimization","rule":"Prompt optimization is independently measured","title":"Prompt optimization requires training and validation examples","item":"01-021","status":"e2e","tags":["@item-01-021","@e2e"],"steps":["Given either example set is missing or not a collection","When the operator requests builder-prompt optimization","Then optimization is refused before an instruction candidate is evaluated"]},{"file":"model/pi-harness/prompt-optimization.feature","module":"prompt-optimization","rule":"Prompt optimization is independently measured","title":"Every instruction candidate is scored by independent regeneration gates","item":"01-022","status":"skip","tags":["@item-01-022","@skip"],"steps":["Given valid training and validation examples","When ORC evaluates an instruction candidate","Then a fresh builder produces a candidate application","And independent verification and a complete candidate-blind black-box grade produce its metric","And the metric does not require a pre-existing accepted product oracle","And the builder cannot supply or alter that metric"]},{"file":"model/pi-harness/prompt-optimization.feature","module":"prompt-optimization","rule":"Prompt optimization is independently measured","title":"Only the winning instruction for each purpose becomes durably active","item":"01-023","status":"skip","tags":["@item-01-023","@skip"],"steps":["Given prompt optimization evaluated one or more instruction candidates for one purpose","When optimization completes","Then the result identifies the winning instruction and its independent score","And ORC durably deactivates the prior instruction for that purpose","And subsequent cycles recover the selected instruction after process restart"]},{"file":"model/pi-harness/prompt-optimization.feature","module":"prompt-optimization","rule":"Prompt optimization is independently measured","title":"GEPA optimizes the complete strategy sent through one prompt seam","item":"01-056","status":"skip","tags":["@item-01-056","@skip"],"steps":["Given ORC owns a complete model-directed strategy and deterministic runtime task context","When an instruction candidate is evaluated","Then ORC renders the exact candidate strategy beside the runtime task context","And the evaluated prompt digest equals the prompt digest received by the builder","And adapter code neither appends instructions nor constructs production prompt text"]},{"file":"model/pi-harness/prompt-optimization.feature","module":"prompt-optimization","rule":"Prompt optimization is independently measured","title":"Generation and verification repair are independent optimization targets","item":"01-057","status":"skip","tags":["@item-01-057","@skip"],"steps":["Given fresh generation and verification repair use different builder purposes","When ORC measures instruction candidates for each purpose","Then the generation candidate is measured from a fresh approved cut","And the repair candidate is measured from fixed failed-verification inputs","And behavior supplied by one purpose cannot improve the other purpose's score"]},{"file":"model/pi-harness/prompt-optimization.feature","module":"prompt-optimization","rule":"Prompt optimization is independently measured","title":"Bedrock reflection is pinned and provenance recorded","item":"01-058","status":"skip","tags":["@item-01-058","@skip"],"steps":["Given the operator selects an enabled Bedrock reflection model","When GEPA proposes an instruction candidate","Then the optimization binds the Bedrock provider and exact model identity","And the proposal records sanitized model-call and usage evidence","And AWS credentials do not enter prompts, events, transcripts, or repository state"]},{"file":"model/pi-harness/prompt-optimization.feature","module":"prompt-optimization","rule":"Prompt optimization is independently measured","title":"ORC owns every builder and grader-author production prompt","item":"01-059","status":"skip","tags":["@item-01-059","@skip"],"steps":["Given a fresh-generation builder, verification-repair builder, or cycle-oracle grader author starts","When its model session is created","Then ORC supplies both the system instruction and task instruction","And ORC binds their digests to the deterministic runtime context and rendered prompt","And TypeScript transports the prompt without constructing or appending production text"]},{"file":"model/pi-harness/prompt-optimization.feature","module":"prompt-optimization","rule":"Prompt optimization is independently measured","title":"Harness enforcement does not depend on model compliance","item":"01-060","status":"skip","tags":["@item-01-060","@skip"],"steps":["Given a production prompt describes the candidate and execution boundaries","When the model ignores or contradicts one of those boundaries","Then execution rooms still enforce filesystem, network, and credential isolation","And verification still enforces stack, Compose, health, tests, affordances, and evidence","And prompt text cannot weaken an independent gate"]},{"file":"model/pi-harness/prompt-optimization.feature","module":"prompt-optimization","rule":"Prompt optimization is independently measured","title":"Bedrock reflection and candidate execution remain separate roles","item":"01-061","status":"skip","tags":["@item-01-061","@skip"],"steps":["Given GEPA uses the pinned Bedrock reflection model","When Bedrock proposes a builder-instruction candidate","Then a fresh fenced Pi/Codex builder executes that instruction","And Bedrock receives no candidate workspace or builder credentials","And the independent grader remains outside both model roles"]},{"file":"model/pi-harness/regeneration-cycle.feature","module":"regeneration-cycle","rule":"The neutral source cut is pinned and physically fenced","title":"Preparing a cut returns immutable commit and tree identities","item":"01-001","status":"e2e","tags":["@item-01-001","@e2e"],"steps":["Given the operator names a full source commit and an execution backend","When the Pi harness prepares the source cut","Then the prepared cut is rooted at exactly that source commit","And its fenced tree identity is recorded","And prior implementation and measurement paths are absent from the reachable cut history"]},{"file":"model/pi-harness/regeneration-cycle.feature","module":"regeneration-cycle","rule":"The neutral source cut is pinned and physically fenced","title":"The builder cannot modify or escape the cut","item":"01-002","status":"skip","tags":["@item-01-002","@skip"],"steps":["Given a prepared cut and a declared candidate scope","When a builder session is opened in Gondolin","Then the cut is mounted read-only","And writes outside the declared candidate scope are denied","And network access, judge material, host credentials, and host session resources are unavailable"]},{"file":"model/pi-harness/regeneration-cycle.feature","module":"regeneration-cycle","rule":"The neutral source cut is pinned and physically fenced","title":"Slice mappings reconstruct the complete cut-bound system view","item":"01-042","status":"skip","tags":["@item-01-042","@skip"],"steps":["Given a prepared cut contains Gherkin behavior items grouped into slices, components, and containers","When the harness maps each item and reduces those mappings into a system view","Then every behavior item appears exactly once in the reconstructed hierarchy","And decomposing that hierarchy reproduces the same slice mappings","And any missing, duplicate, or conflicting mapping makes the composition invalid"]},{"file":"model/pi-harness/regeneration-cycle.feature","module":"regeneration-cycle","rule":"Selection is deterministic and approval binds the reviewed identity","title":"Previewing the same slice produces the same selection identity","item":"01-003","status":"e2e","tags":["@item-01-003","@e2e"],"steps":["Given the same pinned cut, project, slice, and requested item subset","And the selection has not already been approved","When the selection is previewed more than once","Then each preview contains the same ordered item denominator","And each preview has the same selection identity and digest","And its status is awaiting approval"]},{"file":"model/pi-harness/regeneration-cycle.feature","module":"regeneration-cycle","rule":"Selection is deterministic and approval binds the reviewed identity","title":"Approval refuses a digest other than the reviewed digest","item":"01-004","status":"e2e","tags":["@item-01-004","@e2e"],"steps":["Given a selection contract is awaiting approval","When approval names its selection identity with a different digest","Then approval is refused","And the selection remains awaiting approval"]},{"file":"model/pi-harness/regeneration-cycle.feature","module":"regeneration-cycle","rule":"Cycle submission is approved, scoped, and idempotent","title":"An unapproved selection cannot start a regeneration cycle","item":"01-005","status":"e2e","tags":["@item-01-005","@e2e"],"steps":["Given a recorded selection has not been approved","When the operator submits a regeneration cycle for that selection","Then submission is refused before a builder starts"]},{"file":"model/pi-harness/regeneration-cycle.feature","module":"regeneration-cycle","rule":"Cycle submission is approved, scoped, and idempotent","title":"Repeating the same request identity returns the original receipt","item":"01-006","status":"skip","tags":["@item-01-006","@skip"],"steps":["Given a regeneration request has already been submitted","When the identical request is submitted with the same request identity","Then the original cycle and task receipt is returned","But reusing that request identity with a different payload is refused"]},{"file":"model/pi-harness/regeneration-cycle.feature","module":"regeneration-cycle","rule":"The builder produces a new candidate from the pinned contract","title":"The builder starts fresh and must produce workspace output","item":"01-007","status":"skip","tags":["@item-01-007","@skip"],"steps":["Given an approved selection and a prepared cut","When the builder stage runs","Then it uses a fresh separately identified builder session without the operator transcript","And it receives the ORC-selected instruction and approved item identities","And it executes at least one confined workspace tool","And a cycle with no generated workspace output fails"]},{"file":"model/pi-harness/regeneration-cycle.feature","module":"regeneration-cycle","rule":"The builder produces a new candidate from the pinned contract","title":"ORC exposes builder session identity in its executable contract","item":"01-007","status":"e2e","tags":["@item-01-007","@e2e"],"steps":["Given the Pi harness ORC worker is running","When Pi requests the executable regeneration workflow contract","Then the builder result includes the field \"builderSessionId\""]},{"file":"model/pi-harness/regeneration-cycle.feature","module":"regeneration-cycle","rule":"Independent checks determine whether the cycle passes","title":"Verification rejects an incomplete runnable application contract","item":"01-008","status":"skip","tags":["@item-01-008","@skip"],"steps":["Given the builder has produced a candidate","When the independent verifier inspects and runs it","Then the candidate must define app and test services","And the app must define a healthcheck without publishing host ports","And every required compose operation and candidate test command must succeed"]},{"file":"model/pi-harness/regeneration-cycle.feature","module":"regeneration-cycle","rule":"Independent checks determine whether the cycle passes","title":"Independent oracle comparison fails closed when no readable verdict exists","item":"01-009","status":"skip","tags":["@item-01-009","@skip"],"steps":["Given an approved selection with at least one item","When the independent comparator returns no readable observation","Then the oracle comparison stage fails","And no passing cycle measurement is recorded"]},{"file":"model/pi-harness/regeneration-cycle.feature","module":"regeneration-cycle","rule":"Independent checks determine whether the cycle passes","title":"An unreached approved item remains a failed denominator item","item":"01-010","status":"skip","tags":["@item-01-010","@skip"],"steps":["Given the approved selection contains three items","And the evidence collector reaches only one item","When the cycle measurement is reduced","Then the measurement total remains three","And each unreached item is recorded as failed and not graded","And the measurement is marked incomplete"]},{"file":"model/pi-harness/regeneration-cycle.feature","module":"regeneration-cycle","rule":"Independent checks determine whether the cycle passes","title":"A final result requires every independent gate to pass","item":"01-011","status":"skip","tags":["@item-01-011","@skip","@playback"],"steps":["Given the oracle comparator, verifier, instrument conformance, and measurement have completed","When the final result is derived","Then it does not pass when any independent gate failed","And every approved item was graded","And failed approved items remain in the denominator"]},{"file":"model/pi-harness/regeneration-cycle.feature","module":"regeneration-cycle","rule":"Evidence and measurement survive workflow process restarts","title":"Recording the same evidence twice is idempotent","item":"01-012","status":"skip","tags":["@item-01-012","@skip"],"steps":["Given an observation or cycle measurement has already been recorded","When the exact same identity and content are recorded again","Then the existing durable record is returned","But the same identity with different evidence is refused"]},{"file":"model/pi-harness/regeneration-cycle.feature","module":"regeneration-cycle","rule":"Evidence and measurement survive workflow process restarts","title":"A completed measurement is readable after the harness restarts","item":"01-013","status":"skip","tags":["@item-01-013","@skip"],"steps":["Given a cycle measurement was recorded through its validated command","When the harness restarts against the same event store","Then the complete measurement is reconstructed with the same denominator and verdicts"]},{"file":"model/pi-harness/regeneration-cycle.feature","module":"regeneration-cycle","rule":"Backend limitations remain explicit","title":"Host execution cannot be reported as independently graded","item":"01-014","status":"skip","tags":["@item-01-014","@skip"],"steps":["Given a regeneration cycle uses the host backend","When it reaches independent evidence collection and oracle comparison","Then the collector reports that independent comparison requires Gondolin","And the cycle cannot pass as a complete independently graded measurement"]},{"file":"model/pi-harness/runtime-evidence.feature","module":"runtime-evidence","rule":"Runtime evidence preserves authority and collection quality","title":"A successful first grade preserves its Playwright trace","item":null,"status":"skip","tags":["@skip","@gondolin"],"steps":["Given the independent baseline judge drives the candidate only through its public seam","When the complete selected denominator passes","Then the cycle evidence contains a non-empty Playwright trace archive","And the normalized evidence proposal binds the trace archive digest","And a missing Playwright trace prevents oracle proposal"]},{"file":"model/pi-harness/runtime-evidence.feature","module":"runtime-evidence","rule":"Runtime evidence preserves authority and collection quality","title":"Candidate telemetry cannot author an independent verdict","item":"01-031","status":"skip","tags":["@item-01-031","@skip"],"steps":["Given the candidate emits a runtime signal claiming an invariant passed","But no independent validator evaluated the invariant","When the cycle measurement is reduced","Then the candidate signal is retained as evidence","But it cannot produce a passing item observation"]},{"file":"model/pi-harness/runtime-evidence.feature","module":"runtime-evidence","rule":"Runtime evidence preserves authority and collection quality","title":"Missing or dropped required signals are inconclusive","item":"01-032","status":"skip","tags":["@item-01-032","@skip"],"steps":["Given the pinned product-oracle OCI contains the approved normalized evidence for an item","And the sealed harness snapshot carries the generic evaluator for the runtime signals declared by the approved project model","And one required signal is missing, incomplete, sampled, or reported as dropped","When the independent validator compares the captured evidence with the product oracle entry","Then it persists an inconclusive invariant evaluation","And the approved item cannot pass the comparison gate","And collection status identifies the affected signal kind and reason","And diagnostic profiles remain available but cannot author a verdict"]},{"file":"model/pi-harness/runtime-evidence.feature","module":"runtime-evidence","rule":"Runtime evidence preserves authority and collection quality","title":"A passing invariant uses one correlated candidate subject","item":"01-033","status":"skip","tags":["@item-01-033","@skip"],"steps":["Given an accepted domain event and every required projection snapshot","And every signal names the same cycle, operation, event, aggregate, and subject digest","When the independent validator evaluates the named product invariant","Then it may record an evidence-backed passing observation","And the observation identifies every input artifact digest"]},{"file":"model/pi-harness/runtime-evidence.feature","module":"runtime-evidence","rule":"Runtime evidence preserves authority and collection quality","title":"ORC exposes artifact provenance in its executable contract","item":"01-033","status":"e2e","tags":["@item-01-033","@e2e"],"steps":["Given the Pi harness ORC worker is running","When Pi requests the executable regeneration workflow contract","Then the observation includes the field \"artifacts\""]},{"file":"model/pi-harness/runtime-evidence.feature","module":"runtime-evidence","rule":"Runtime evidence preserves authority and collection quality","title":"Instrument conformance is independent of the behavioral grade","item":null,"status":"skip","tags":["@skip"],"steps":["Given the independent execution emitted runtime evidence","And the black-box oracle comparator returned a failure","When the instrument conformance stage evaluates the runtime evidence","Then it records its own pass, fail, or inconclusive observation","And the behavioral failure cannot skip or author the instrument verdict","And the final cycle passes only when both independent results pass"]},{"file":"model/pi-harness/runtime-evidence.feature","module":"runtime-evidence","rule":"Runtime evidence preserves authority and collection quality","title":"Instrument conformance is selected entirely from the pinned project model","item":null,"status":"skip","tags":["@skip"],"steps":["Given each selected item has a runtime evidence contract in the pinned project model","When the instrument conformance stage evaluates the selected items","Then one generic evaluator reads their declared paths, record kinds, cardinalities, correlations, and invariants","And adding a project or item does not require evaluator or ORC source changes","And a selected item with no contract receives a failing observation"]},{"file":"model/pi-harness/runtime-evidence.feature","module":"runtime-evidence","rule":"Runtime evidence preserves authority and collection quality","title":"OTel and Allure project the persisted invariant evaluation","item":"01-034","status":"e2e","tags":["@item-01-034","@e2e"],"steps":["Given an independent invariant evaluation and its evidence digest were persisted","When an OTel result span and Allure report are emitted","Then both identify the persisted evaluation and evidence digest","And both name the same candidate subject and oracle digests","And neither projection can change the recorded verdict"]},{"file":"model/pi-harness/runtime-evidence.feature","module":"runtime-evidence","rule":"Runtime evidence preserves authority and collection quality","title":"An operator Pi session profiles a Gondolin VM directly","item":"01-041","status":"skip","tags":["@item-01-041","@skip"],"steps":["Given an isolated Pi observer session has YOLO tool access inside Gondolin","When the observer profiles the VM while exercising the selected scenario","Then its profile artifacts are recorded as operator-invoked evidence","And the profile cannot become an authoritative grade without deterministic validation"]},{"file":"model/pi-harness/runtime-evidence.feature","module":"runtime-evidence","rule":"Runtime evidence preserves authority and collection quality","title":"Each comparison cycle isolates evidence from its pinned OTel capture policy","item":"01-042","status":"skip","tags":["@item-01-042","@skip","@gondolin"],"steps":["Given the sealed harness snapshot supplies a declarative OTel capture policy","When an independent Gondolin validator room opens for one regeneration cycle","Then the candidate and OTel capture policy are mounted read-only","And the candidate subject digest remains unchanged after observation","And a fresh cycle evidence volume is the only writable grading mount","And the validator image supplies OBI and the OTel eBPF profiler with tracefs and BPF FS mounted","And native OTLP traces, metrics, and profiles are cycle-scoped diagnostic evidence"]}],"c4":[{"title":"System Context","source":"flowchart LR\n    operator[\"Harness operator<br/>[Person]<br/>Reviews selections and submits regeneration work\"]\n    pi[\"Operator session host<br/>[External Software System]<br/>Codex, Pi, or another client hosting control tools\"]\n    source[\"Löyly Git repository<br/>[External Software System]<br/>Provides commits, product contracts, and source evidence\"]\n    registry[\"OCI registry<br/>[External Software System]<br/>Stores product-oracle and instrument-oracle artifacts by descriptor digest\"]\n    models[\"Model providers<br/>[External Software System]<br/>Codex builder inference and ORC/GEPA LLM calls\"]\n    gondolin[\"Gondolin runtime<br/>[External Software System]<br/>Creates deny-egress capability-confined VMs\"]\n    compose[\"Docker/Compose runtime<br/>[External Software System]<br/>Runs inside the execution room on Gondolin; no host socket\"]\n    candidate[\"Generated candidate application<br/>[External Software System]<br/>Subject under independent verification and grading\"]\n\n    harness[\"Session-hosted ORC Regeneration Harness<br/>[Software System]<br/>Cuts, builds, instruments, verifies, grades, and measures one approved preparation\"]\n\n    operator -->|\"operates through a root session\"| pi\n    pi -->|\"prepares, approves, starts, observes, and evaluates cycles\"| harness\n    harness -->|\"reads an approved commit and fenced tree\"| source\n    harness -->|\"pulls digest-pinned executable contracts\"| registry\n    harness -->|\"requests builder and prompt candidates\"| models\n    harness -->|\"creates isolated execution rooms\"| gondolin\n    harness -->|\"runs compose verification commands\"| compose\n    harness -->|\"creates, probes, and grades\"| candidate\n    harness -->|\"returns selections, task outcomes, and measurements\"| pi"},{"title":"Container view","source":"flowchart TB\n    pi[\"Pi runtime<br/>[External Software System]\"]\n    git[\"Git checkout<br/>[External Software System]\"]\n    registry[\"OCI registry<br/>[External Software System]\"]\n    llm[\"Model providers<br/>[External Software System]\"]\n    gondolin[\"Gondolin runtime<br/>[External Software System]\"]\n    docker[\"Room-local Docker/Compose<br/>[External Software System]\"]\n    subject[\"Candidate application<br/>[External Software System]\"]\n\n    subgraph system[\"Session-hosted ORC Regeneration Harness — Software System\"]\n        extension[\"Pi extension adapter<br/>[Container · TypeScript in Pi process]<br/>Exposes exploration tools and transports approved ORC requests\"]\n        worker[\"ORC worker<br/>[Container · Clojure process]<br/>Owns workflows and durable event facts; task receipts and prompt activation are currently in memory\"]\n        cutworker[\"Cut adapter<br/>[Container · Node process]<br/>Creates pinned fenced cuts\"]\n        builder[\"Builder adapter<br/>[Container · Node process]<br/>Runs one fresh Pi/Codex builder session\"]\n        grader[\"Execution adapter<br/>[Container · Node process]<br/>Runs verifier and independent grader commands\"]\n        events[(\"ORC and Grain event store<br/>[Container · SQLite data store]\")]\n        projections[(\"Projection cache<br/>[Container · LMDB data store]\")]\n        cuts[(\"Cut store<br/>[Container · Filesystem data store]\")]\n        outputs[(\"Candidate and evidence store<br/>[Container · Filesystem data store]\")]\n    end\n\n    pi -->|\"loads extension and invokes tools\"| extension\n    extension -->|\"JSON-lines RPC over child stdio\"| worker\n    worker -->|\"submits cut request over stdio\"| cutworker\n    worker -->|\"submits selected instruction and scope over stdio\"| builder\n    worker -->|\"submits verifier and grader commands over stdio\"| grader\n    worker -->|\"appends ORC execution and validated Grain events\"| events\n    worker -->|\"reads durable projections\"| projections\n    events -->|\"feeds tenant projection poller\"| projections\n\n    git -->|\"provides commit and cut policy\"| cutworker\n    worker -->|\"resolves immutable descriptors; tags are lookup aliases\"| registry\n    worker -->|\"checks source commit and tree\"| git\n    cutworker -->|\"writes immutable cut plus manifest\"| cuts\n    builder -->|\"reads cut\"| cuts\n    builder -->|\"requests inference\"| llm\n    builder -->|\"persists generated output after session completion\"| outputs\n    grader -->|\"reads cut\"| cuts\n    grader -->|\"reads candidate and writes cycle evidence\"| outputs\n    cutworker -->|\"requests cut VM when backend is Gondolin\"| gondolin\n    builder -->|\"requests builder VM when backend is Gondolin\"| gondolin\n    grader -->|\"requests read-only grader VM when backend is Gondolin\"| gondolin\n    grader -->|\"runs compose lifecycle and tests\"| docker\n    docker -->|\"starts and probes\"| subject"},{"title":"ORC worker component view","source":"flowchart TB\n    rpc[\"Public interface + entrypoints<br/>[Component]<br/>Thin dispatch for selection, cycle control, optimization, and measurement\"]\n    worker[\"core.worker<br/>[Component]<br/>Serialized ORC executors, workflow registry, and stage coordination\"]\n    workflows[\"workflows.*<br/>[Component]<br/>Cut and regeneration behavior trees plus blackboard contracts\"]\n    build[\"core.build.*<br/>[Component]<br/>Builder prompt, application contract, stack checks, and subject sealing\"]\n    selection[\"core.selection.*<br/>[Component]<br/>Resolves deterministic cut-slice selections\"]\n    oracle[\"core.oracle.*<br/>[Component]<br/>Resolves and calibrates instrument and product OCI oracles\"]\n    grading[\"core.grading.*<br/>[Component]<br/>Interprets Compose verification and independent grader evidence\"]\n    evidence[\"core.evidence.*<br/>[Component]<br/>Seals manifests and emits deterministic Allure projections\"]\n    runtime[\"core.runtime.*<br/>[Component]<br/>Durable system composition and newline-delimited JSON process adapters\"]\n    grainmodel[\"grain.interface + grain.core.*<br/>[Component]<br/>Selection, progress, observation, and measurement commands and projections\"]\n    orc[\"ORC workflow engine<br/>[Component · shared ORC library]<br/>Builds and executes sheets\"]\n    grain[\"Grain command/event infrastructure<br/>[Component · shared Grain libraries]<br/>Validates commands, events, and projections\"]\n\n    rpc -->|\"calls only\"| worker\n    rpc -->|\"previews selections through\"| selection\n    rpc -->|\"records and queries through\"| grainmodel\n    worker -->|\"registers and executes\"| workflows\n    worker --> build\n    worker --> oracle\n    worker --> grading\n    worker --> evidence\n    worker --> runtime\n    worker --> grainmodel\n    workflows -->|\"execute through\"| orc\n    build -->|\"invokes confined builders through\"| runtime\n    oracle -->|\"runs fixture adapters through\"| runtime\n    grading -->|\"receives command evidence through\"| runtime\n    grainmodel -->|\"uses\"| grain"}],"conformance":[{"item":"01-001","status":"Implemented","note":"Pinned cut creation is implemented in `harness/src/cut.ts`."},{"item":"01-002","status":"Implemented","note":"Gondolin builder confinement is implemented in `harness/src/builder-room.ts`; supported target stacks select distinct offline rooms and unknown stacks fail closed."},{"item":"01-003","status":"Implemented","note":"Deterministic unapproved selection identity is implemented by `selection_registry.clj`."},{"item":"01-004","status":"Implemented","note":"Approval binds the selection identity and digest."},{"item":"01-005","status":"Implemented","note":"Approved selection retrieval is supported by the durable entrypoint."},{"item":"01-006","status":"Partial","note":"Request idempotency is held in worker memory and is lost on restart."},{"item":"01-007","status":"Implemented","note":"The builder uses a fresh persisted Pi session, returns its distinct session identity in the builder result, and requires tool output."},{"item":"01-008","status":"Implemented","note":"Compose structure, lifecycle, and supported-stack conformance checks are implemented."},{"item":"01-009","status":"Implemented","note":"Verification output is captured by the cycle workflow; failed verification can drive a maximum-three-attempt repair loop through read-only evidence pointers."},{"item":"01-010","status":"Implemented","note":"Binary item observations reduce into a cycle measurement."},{"item":"01-011","status":"Implemented","note":"The grade gate preserves a valid poor score as workflow output."},{"item":"01-012","status":"Implemented","note":"Observation and measurement schemas retain evidence identities and digests."},{"item":"01-013","status":"Implemented","note":"Measurement reduction retains the complete supplied denominator."},{"item":"01-014","status":"Partial","note":"Host cannot pass independent grading, and the terminal result does not preserve the modeled explicit limitation."},{"item":"01-015","status":"Partial","note":"Full source-commit validation occurs after a cut task receipt is created."},{"item":"01-016","status":"Partial","note":"Selection validation reads the legacy plan feature, not the complete project model."},{"item":"01-017","status":"Partial","note":"Candidate-scope validation occurs during builder-room creation after submission."},{"item":"01-018","status":"Implemented","note":"Repeated waits are stable only for the lifetime of the current worker."},{"item":"01-019","status":"Implemented","note":"Unknown numeric task identities are rejected."},{"item":"01-020","status":"Partial","note":"`start-cycle` plus `execution-status` reconstructs overall state from ORC's durable tick projection and startup resumes abandoned ORC frontiers; legacy numeric `submit`/`wait` receipts and futures remain process-local."},{"item":"01-021","status":"Implemented","note":"Missing or non-vector GEPA example collections are refused."},{"item":"01-022","status":"Implemented","note":"GEPA scoring is gated by full harness calibration, requires an approved selection, runs a fresh digest-identified candidate, validates the product oracle and Compose contract, and scores the complete independent per-item measurement."},{"item":"01-023","status":"Partial","note":"A winner is independently selected, but activation remains only in worker memory and metric evidence is not yet sealed into a harness evidence manifest."},{"item":"01-024","status":"Implemented","note":"ORC runs `cut → harness-calibration → builder → instrument → oracle → affordance-conformance → verify → repair-verification → graders → instrument-conformance → record-cycle → grade-gate`; affordance conformance is capability-based, renderer-neutral, and non-applicable for slices not selected by the contract, calibration must pass before candidate construction, repair is limited to three verification attempts, and grading cannot start until the effective final verification passes."},{"item":"01-025","status":"Implemented","note":"Instrumentation rechecks the builder digest and binds a sibling evidence root without modifying the candidate."},{"item":"01-026","status":"Partial","note":"Product-oracle OCI validation exists, but the sharpened contract still needs E2E proof that commit, fenced tree, exact denominator, and instrument-oracle descriptor are verified before builder startup; mutable tags must never become authority."},{"item":"01-027","status":"Merged","note":"Removed from the denominator; read-only mounts and before/after subject-digest preservation are exercised by active `01-042`."},{"item":"01-028","status":"Implemented","note":"Observation validation preserves evidence provenance."},{"item":"01-029","status":"Implemented","note":"Raw evidence is sealed into the persisted cycle measurement before Allure is derived; report loss cannot change the recorded verdict."},{"item":"01-030","status":"Not implemented","note":"Non-success outcomes collapse, and failed stages do not persist a complete denominator measurement."},{"item":"01-031","status":"Partial","note":"Runtime conformance is persisted under a distinct independent producer, but the observation schema does not yet encode the full candidate/observer/grader authority model."},{"item":"01-032","status":"Not implemented","note":"The model now requires missing, incomplete, sampled, or dropped signals to persist `inconclusive` with affected kind and reason, but the E2E fault cases remain skipped."},{"item":"01-033","status":"Implemented","note":"A generic, domain-free evaluator loads the selected project's runtime-evidence contract from the pinned cut, validates declared record cardinality, values, correlations, and `fields-equal` invariants, and emits a separate observation for every contracted selected item. Before persistence, every observation is enriched with all sealed input-artifact digests. Löyly has live runtime-evidence contracts for `@item-01-007` and `@item-01-008`; all eleven selected items are independently black-box graded."},{"item":"01-034","status":"Implemented","note":"After Grain returns the persisted invariant observation, the harness derives both an Allure result and an OTLP JSON result span carrying the same deterministic evaluation identity, verdict, and sealed evidence-manifest digest; neither projection can author or alter the verdict."},{"item":"01-035","status":"Not implemented","note":"Approval binds only the selection digest; scope, target stack, execution profile, pinned inputs, diagram, and outer-cycle budget are not one approved preparation."},{"item":"01-036","status":"Partial","note":"The JSON control boundary exposes ORC `start-cycle` with caller-supplied durable identities and survives client disconnects, but no complete session-agnostic preparation contract or parent-cycle lineage exists."},{"item":"01-037","status":"Partial","note":"The RPC reconciles authoritative ORC tick status with durable stage, attempt, and builder-session projections, and startup resumes abandoned ORC frontiers. Push notification subscription and automatic live rendering remain unimplemented."},{"item":"01-038","status":"Implemented","note":"Each build attempt persists an append-only Pi transcript and a read-only RPC exposes committed turns, tool-call count, generated top-level entries, status, and progress. The E2E verifies observation does not alter transcript or candidate fixture content."},{"item":"01-039","status":"Not implemented","note":"There is no explicit pause, steer, or fork protocol and no assisted-candidate provenance marker."},{"item":"01-040","status":"Not implemented","note":"Pi transcripts and VM-visible workspace generations are not durably bound; only completed generated output is persisted."},{"item":"01-041","status":"Not implemented","note":"A Pi operator session does not yet drive exploratory profiling inside Gondolin as a modeled, provenance-recorded operation."},{"item":"01-042","status":"Implemented","note":"The active Gondolin E2E verifies read-only candidate and capture-policy mounts, the sole writable cycle evidence volume, before/after subject digest equality, the baked OBI/OTel eBPF toolchain, tracefs/BPF FS, and diagnostic-only OTLP policy."}]};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const human=s=>String(s??"").split("/").pop().replace(/([a-z0-9])([A-Z])/g,"$1 $2").replace(/[-_]/g," ").replace(/\b\w/g,c=>c.toUpperCase());
const short=s=>String(s??"").split("/").pop();
const MODULES=Object.fromEntries(DOMAIN.modules.map(m=>[m.id,m]));
const scenariosFor=id=>DOMAIN.scenarios.filter(s=>s.module===id);
const totalRules=DOMAIN.modules.reduce((n,m)=>n+m.rules.length,0);
const totalRequires=DOMAIN.modules.reduce((n,m)=>n+m.rules.reduce((x,r)=>x+r.requires.length,0),0);
const blocks=k=>Object.entries(DOMAIN.eventModel[k]||{});
const refs=b=>b["grain/allium"]||[];
const linked=(kind,m,r)=>blocks(kind).filter(([,b])=>refs(b).some(x=>String(x.spec||"").endsWith(m.file)&&x.name===r.name));
const trigger=r=>(String(r.when||"").match(/^(\w+)\(/)||[])[1]||r.name;
const actor=(m,r)=>m.surfaces.find(s=>(s.provides||[]).includes(trigger(r)))?.facing||(/Operator|Approve|Preview|Submit|Prepare/.test(r.name)?"Operator":"ORC");
const aggregate=m=>m.entities.find(e=>!e.external)?.name||human(m.id);
const st=(kind,label,sub="",href="")=>{const body=`${esc(human(label))}${sub?`<small>${esc(sub)}</small>`:""}`;return href?`<a class="st ${kind}" href="${href}">${body}</a>`:`<span class="st ${kind}">${body}</span>`};
function crumbs(parts){document.getElementById("crumbs").innerHTML=parts.map((p,i)=>i===parts.length-1?`<span class="here" aria-current="page">${esc(p[0])}</span>`:`<a href="${p[1]}">${esc(p[0])}</a><span class="sep">›</span>`).join("")}
function tabs(active){document.getElementById("tabs").innerHTML=[["model","#model","Event model"],["grain","#grain","Grain"],["c4","#c4","C4"],["review","#review","Review"]].map(([id,href,label])=>`<a class="${active===id?"on":""}" href="${href}">${label}</a>`).join("")}
function stats(){return `<div class="stats"><span><b>${DOMAIN.modules.length}</b> modules</span><span><b>${totalRules}</b> rules</span><span><b>${totalRequires}</b> requires / refusals</span><span><b>${DOMAIN.scenarios.length}</b> examples</span><span><b>${DOMAIN.scenarios.filter(s=>s.status==="e2e").length}</b> active E2E</span><span><b>${DOMAIN.scenarios.filter(s=>s.status==="skip").length}</b> explicit gaps</span></div>`}
function overviewBoard(){
  const cols=`170px repeat(${DOMAIN.modules.length},minmax(185px,1fr))`;
  let html=`<div class="corner"></div>${DOMAIN.modules.map(m=>`<div class="stage"><b>${esc(human(m.id))}</b><a href="#module/${m.id}">open module →</a></div>`).join("")}`;
  const lane=(name,render)=>{html+=`<div class="lane">${name}</div>`+DOMAIN.modules.map(m=>`<div><div class="stack">${render(m)}</div></div>`).join("")};
  lane("Actors / surfaces",m=>[...new Set(m.rules.map(r=>actor(m,r)))].slice(0,6).map(x=>st("scr",x)).join(""));
  lane("Commands",m=>m.rules.slice(0,7).map(r=>st("cmd",trigger(r),r.name,`#rule/${m.id}/${r.name}`)).join(""));
  lane("Events / facts",m=>m.rules.slice(0,7).flatMap(r=>{const ev=linked("events",m,r);return ev.length?ev.map(([k,b])=>st("evt",k,b.description||"")):(r.ensures||[]).slice(0,1).map(x=>st("evt",x))}).join(""));
  lane("Refusals",m=>m.rules.flatMap(r=>r.requires.map((x,i)=>st("fail",x,`${r.name} · ${i+1}`,`#rule/${m.id}/${r.name}`))).slice(0,8).join(""));
  lane("Examples",m=>scenariosFor(m.id).slice(0,7).map(s=>st(s.status==="skip"?"fail":"rm",s.title,s.item?`item ${s.item}`:s.status,`#module/${m.id}`)).join(""));
  return `<div class="frame"><div class="journey" style="grid-template-columns:${cols}">${html}</div></div>`;
}
function moduleCard(m){const sc=scenariosFor(m.id);const refusals=m.rules.reduce((n,r)=>n+r.requires.length,0);return `<a class="card" href="#module/${m.id}"><h3>${esc(human(m.id))}</h3><p class="muted">${esc(m.description||"")}</p><div class="nums"><div><b>${m.rules.length}</b>rules</div><div><b>${refusals}</b>refusals</div><div><b>${sc.length}</b>examples</div><div><b>${m.entities.length}</b>entities</div><div><b>${m.invariants.length}</b>invariants</div><div><b>${m.surfaces.length}</b>surfaces</div></div><span class="src">Allium · Gherkin · Grain</span></a>`}
function viewModel(){crumbs([["Pi Harness","#model"]]);tabs("model");document.getElementById("view").innerHTML=`<div class="head"><div class="eyebrow">Level 1 · Pi harness service area</div><h1>Pi Harness, as one event model</h1><p class="muted">Read from left to right or drill into a module. Actors issue commands; rules protect boundaries; facts are recorded; every <code>requires</code> clause remains visible as a refusal. Gherkin examples project the same behavior at an executable public seam.</p>${stats()}<div class="note"><b>Authority stays in the specifications.</b> Pi explores and presents an exact selection. ORC alone executes the approved contract. A builder never declares completion.</div></div><section><h2>The whole behavior</h2><p class="muted">Columns are maintained Allium modules. Rows are EventStorm concerns. This board scrolls inside its frame on smaller screens.</p>${overviewBoard()}</section><section><h2>Drill down by module</h2><div class="cards">${DOMAIN.modules.map(moduleCard).join("")}</div></section>`}
function storm(m){return `<div class="storm"><div class="storm-key"><span><i style="background:#fbf3d5;border:2px solid #f2c14e"></i>actor</span><span><i style="background:#4389d6"></i>command</span><span><i style="background:#f2c14e"></i>consistency boundary</span><span><i style="background:#d98444"></i>event or state fact</span><span><i style="background:#f8e5da;border:1px solid #d98444"></i>refusal</span></div><div class="storm-flow">${m.rules.map(r=>{const ev=linked("events",m,r);const facts=ev.length?ev.map(([k,b])=>`<span class="sk evt">${esc(human(k))}<small>${esc(b.description||"")}</small></span>`).join(""):(r.ensures.length?r.ensures.slice(0,3):["No durable fact declared here"]).map(x=>`<span class="sk evt quiet">${esc(x)}</span>`).join("");return `<div class="clu"><span class="sk actor">${esc(human(actor(m,r)))}</span><span class="sk agg">${esc(aggregate(m))}</span><a class="sk cmd" href="#rule/${m.id}/${r.name}">${esc(human(linked("commands",m,r)[0]?.[0]||trigger(r)))}<small>${esc(r.name)}</small></a><div class="facts">${facts}</div><div class="refs">${r.requires.map((x,i)=>`<a class="sk fail" href="#rule/${m.id}/${r.name}"><b>Refusal ${i+1}</b>${esc(x)}</a>`).join("")}</div></div>`}).join("")}</div></div>`}
function scenarioCard(s){return `<article class="scenario"><header><h3>${esc(s.title)}</h3><span class="status ${s.status}">${esc(s.status)}</span></header><div class="tags">${s.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>${s.steps.map(line=>{const [kw,...rest]=line.split(" ");return `<div class="gw"><b>${esc(kw)}</b><span>${esc(rest.join(" "))}</span></div>`}).join("")}<div class="muted mono">${esc(s.file)}${s.rule?` · Rule: ${esc(s.rule)}`:""}</div></article>`}
function ruleCard(m,r){return `<article class="spec" id="r-${esc(r.name)}"><div class="spec-h"><h3>${esc(r.name)}</h3><span class="src">${r.requires.length} refusals · ${r.ensures.length} effects</span></div><div class="spec-grid"><div class="k">When</div><div><code class="cl">${esc(r.when||"")}</code></div><div class="k">Only if</div><ol class="rqs">${r.requires.map((x,i)=>`<li class="rq"><span class="n">${i+1}</span><code class="cl">${esc(x)}</code></li>`).join("")||`<li class="muted">No refusal declared.</li>`}</ol><div class="k">Then</div><ul class="then">${r.ensures.map(x=>`<li><span class="verb">records</span><code class="cl">${esc(x)}</code></li>`).join("")}</ul></div><details class="source"><summary>Allium source · ${esc(m.file)}</summary><pre class="code">${esc(r.source)}</pre></details></article>`}
function linkedTopology(m){const kinds=[["commands","Commands","cmd"],["events","Events","evt"],["read-models","Read models","rm"],["queries","Queries","rm"],["todo-processors","Policies","proc"],["screens","Screens","scr"]];return `<div class="topology">${kinds.map(([kind,label,cls])=>{const xs=blocks(kind).filter(([,b])=>refs(b).some(x=>String(x.spec||"").endsWith(m.file)));return `<div class="top-col"><h3>${label} <span class="muted">${xs.length}</span></h3>${xs.map(([k,b])=>st(cls,k,b.description||"")).join("")||`<span class="muted">No linked block.</span>`}</div>`}).join("")}</div>`}
function viewModule(id,ruleName){const m=MODULES[id];if(!m)return viewModel();crumbs([["Pi Harness","#model"],[human(m.id),`#module/${m.id}`]]);tabs("model");document.getElementById("view").innerHTML=`<div class="head"><div class="eyebrow">Level 2 · behavior module · ${esc(m.file)}</div><h1>${esc(human(m.id))}</h1><p class="muted">${esc(m.description||"")}</p><div class="stats"><span><b>${m.rules.length}</b> rules</span><span><b>${m.rules.reduce((n,r)=>n+r.requires.length,0)}</b> refusals</span><span><b>${m.entities.length}</b> entities</span><span><b>${m.invariants.length}</b> invariants</span><span><b>${scenariosFor(m.id).length}</b> examples</span></div></div><section><h2>Event storm</h2><p class="muted">The behavioral path from actor and command through the protected boundary to facts and explicit refusals.</p>${storm(m)}</section><section><h2>When · Only if · Then</h2><div class="specs">${m.rules.map(r=>ruleCard(m,r)).join("")}</div></section><section><h2>Executable examples</h2><p class="muted">Active E2E and explicitly skipped examples remain in the same denominator.</p><div class="scenarios">${scenariosFor(m.id).map(scenarioCard).join("")||`<div class="note">No matching feature file.</div>`}</div></section><section><h2>Linked Grain topology</h2><p class="muted">Only blocks whose <code>:grain/allium</code> metadata points back to this module are shown.</p>${linkedTopology(m)}</section>`;if(ruleName)setTimeout(()=>{const el=document.getElementById(`r-${ruleName}`);el?.scrollIntoView({block:"start"})},0)}
function viewGrain(){crumbs([["Pi Harness","#model"],["Grain topology","#grain"]]);tabs("grain");const kinds=[["commands","Commands","cmd"],["events","Events / durable facts","evt"],["read-models","Read models","rm"],["queries","Queries","rm"],["todo-processors","Policies / processors","proc"],["screens","Screens","scr"]];document.getElementById("view").innerHTML=`<div class="head"><div class="eyebrow">Supporting view · regeneration_event_model.clj</div><h1>Commands become facts, then projections</h1><p class="muted">Grain supplies durable command, event and projection topology. It does not replace ORC workflow authority or duplicate product behavior.</p></div><section><div class="topology">${kinds.map(([k,l,c])=>`<div class="top-col"><h3>${l} <span class="muted">${blocks(k).length}</span></h3>${blocks(k).map(([id,b])=>st(c,id,b.description||"")).join("")}</div>`).join("")}</div></section><section><h2>Named flows</h2><div class="flows">${blocks("flows").map(([id,f])=>`<article class="flow"><h3>${esc(human(id))}</h3><p class="muted">${esc(f.description||"")}</p>${(f.steps||[]).map(s=>`<div class="flow-path"><span class="flow-node"><b>${esc(s.from?.[0]||"")}</b><br>${esc(human(s.from?.[1]||""))}</span><span class="arrow">→</span><span class="flow-node"><b>${esc(s.to?.[0]||"")}</b><br>${esc(human(s.to?.[1]||""))}</span></div>`).join("")}</article>`).join("")}</div></section>`}
async function renderMermaid(){if(!window.mermaid)return;mermaid.initialize({startOnLoad:false,securityLevel:"strict",theme:"base",flowchart:{htmlLabels:true,useMaxWidth:true}});await mermaid.run({querySelector:"pre.mermaid"})}
function viewC4(){crumbs([["Pi Harness","#model"],["C4 evidence","#c4"]]);tabs("c4");document.getElementById("view").innerHTML=`<div class="head"><div class="eyebrow">Supporting structural evidence · .pi/architecture.md</div><h1>System boundary to ORC components</h1><p class="muted">These are the three maintained structural views. EventStorm remains the behavioral source; C4 explains where that behavior runs.</p></div>${DOMAIN.c4.map((d,i)=>`<section><h2>${esc(d.title)}</h2><div class="mm"><button type="button" data-size="${i}">Actual size</button><pre class="mermaid">${esc(d.source)}</pre></div></section>`).join("")}`;renderMermaid().then(()=>document.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{const box=b.closest(".mm");box.classList.toggle("full");b.textContent=box.classList.contains("full")?"Fit to width":"Actual size"}))}
let reviewFilter="all";
function viewReview(){crumbs([["Pi Harness","#model"],["Review","#review"]]);tabs("review");const filtered=DOMAIN.scenarios.filter(s=>reviewFilter==="all"||s.status===reviewFilter);document.getElementById("view").innerHTML=`<div class="head"><div class="eyebrow">Complete denominator · evidence and gaps</div><h1>Progress without hidden gaps</h1><p class="muted">Filtering changes the view, never the denominator. Failed, missing, skipped and incomplete behavior remains visible.</p>${stats()}</div><section><h2>Acceptance inventory</h2><div class="filter">${[["all","All"],["e2e","Active E2E"],["skip","Explicit skip"]].map(([v,l])=>`<button class="${reviewFilter===v?"on":""}" data-filter="${v}">${l}</button>`).join("")}</div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Module</th><th>Scenario</th><th>State</th></tr></thead><tbody>${filtered.map(s=>`<tr><td>${esc(s.item||"—")}</td><td><a href="#module/${s.module}">${esc(human(s.module))}</a></td><td>${esc(s.title)}</td><td><span class="status ${s.status}">${esc(s.status)}</span></td></tr>`).join("")}</tbody></table></div></section><section><h2>Architecture conformance</h2><div class="table-wrap"><table><thead><tr><th>Item</th><th>Status</th><th>Evidence or gap</th></tr></thead><tbody>${DOMAIN.conformance.map(x=>`<tr><td>${esc(x.item)}</td><td>${esc(x.status)}</td><td>${esc(x.note)}</td></tr>`).join("")}</tbody></table></div></section>`;document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{reviewFilter=b.dataset.filter;viewReview()})}
function route(){const p=(location.hash||"#model").slice(1).split("/");scrollTo(0,0);if(p[0]==="module")viewModule(p[1]);else if(p[0]==="rule")viewModule(p[1],p[2]);else if(p[0]==="grain")viewGrain();else if(p[0]==="c4")viewC4();else if(p[0]==="review")viewReview();else viewModel()}
addEventListener("hashchange",route);route();
</script>
</body>
</html>
