ce never enter the builder or verification-repair loop.\n}","facing":null,"provides":["ApprovedFreshSliceGenerationRequested","FreshSliceGenerationVerificationFailed","FreshSliceGenerationGradeCompleted","OperatorApprovesOracleProposal","ProductOraclePublished","FirstBuilderFailed","ApprovedSliceSubmitted"]}],"entities":[{"name":"ApprovedSliceRoute","source":"entity ApprovedSliceRoute {\n    request_identity: String\n    request_digest: String\n    project_identity: String\n    container_identity: String\n    component_identity: String\n    selection_identity: String\n    operation: ApprovedSliceOperation\n    parent_candidate_identity: String?\n    parent_candidate_root: String?\n    parent_candidate_digest: String?\n}","external":false},{"name":"SourceCut","source":"entity SourceCut {\n    identity: String\n    source_commit: String\n    tree_digest: String\n}","external":false},{"name":"HarnessSnapshot","source":"entity HarnessSnapshot {\n    identity: String\n    harness_revision: String\n    manifest_digest: String\n    runtime_asset_digests: List<String>\n    calibration_digest: String\n    sealed: Boolean\n    calibrated: Boolean\n}","external":false},{"name":"FreshSliceGeneration","source":"entity FreshSliceGeneration {\n    identity: String\n    project_identity: String\n    container_identity: String\n    component_identity: String\n    operation: ApprovedSliceOperation\n    source_cut: SourceCut\n    harness_snapshot: HarnessSnapshot\n    selection_identity: String\n    selection_digest: String\n    approved_items: List<String>\n    workspace_scope: List<String>\n    status: FreshSliceGenerationStatus\n    failure_reason: String?\n}","external":false},{"name":"ItemVerdict","source":"entity ItemVerdict {\n    item_identity: String\n    verdict: String\n    evidence_digest: String\n}","external":false},{"name":"FreshCycleGrade","source":"entity FreshCycleGrade {\n    generation: FreshSliceGeneration\n    cycle_oracle_binding_digest: String\n    subject_digest: String\n    judge_identity: String\n    item_verdicts: List<ItemVerdict>\n    normalized_evidence_digest: String\n    instrument_conformance_passed: Boolean\n    complete: Boolean\n    passed: Boolean\n}","external":false},{"name":"SealedCycleOracle","source":"entity SealedCycleOracle {\n    generation: FreshSliceGeneration\n    binding_digest: String\n    harness_snapshot_digest: String\n    author_session_identity: String\n    selected_items: List<String>\n    evaluator_kinds: List<String>\n    candidate_blind: Boolean\n    carried_calibration_passed: Boolean\n    uncarried_calibration_passed: Boolean\n}","external":false},{"name":"ProductOracleProposal","source":"entity ProductOracleProposal {\n    identity: String\n    generation: FreshSliceGeneration\n    selection_identity: String\n    selection_digest: String\n    scenario_digests: List<String>\n    subject_digest: String\n    judge_identity: String\n    denominator: Integer\n    normalized_evidence_digest: String\n    proposal_digest: String\n    status: OracleProposalStatus\n}","external":false},{"name":"AcceptedProductOracle","source":"entity AcceptedProductOracle {\n    proposal: ProductOracleProposal\n    descriptor_digest: String\n    approved_by: String\n    published_at: String\n}","external":false},{"name":"ComponentCandidate","source":"entity ComponentCandidate {\n    identity: String\n    output_root: String\n    subject_digest: String\n    project_identity: String\n    container_identity: String\n    component_identity: String\n    operation: ApprovedSliceOperation\n    parent_candidate_identity: String?\n    disposition: CandidateDisposition\n    oracle_descriptor_digest: String\n}","external":false},{"name":"GeneratedCandidate","source":"entity GeneratedCandidate {\n    generation: FreshSliceGeneration\n    builder_session_identity: String\n    subject_digest: String\n    output_root: String\n    disposition: CandidateDisposition\n    oracle_descriptor_digest: String\n}","external":false}],"rules":[{"name":"BuildCalibrateAndSealCycleOracle","source":"rule BuildCalibrateAndSealCycleOracle {\n    when: FreshSliceGenerationVerificationPassed(generation)\n    requires: generation.status = running\n    requires: generation.harness_snapshot.sealed\n    requires: generation.harness_snapshot.calibrated\n    requires: oracle_author_can_read_only_approved_cut_and_public_calibration_protocol(generation)\n    requires: oracle_author_cannot_read_candidate_or_evaluation_material(generation)\n    requires: cycle_oracle_contains_only_applicable_behavior_affordance_and_runtime_evaluators(generation)\n    requires: cycle_oracle_passes_carried_and_uncarried_calibration(generation)\n    ensures: SealedCycleOracle.created(\n        generation: generation,\n        binding_digest: digest_cycle_oracle_binding(generation),\n        harness_snapshot_digest: generation.harness_snapshot.manifest_digest,\n        author_session_identity: independent_oracle_author_session(generation),\n        selected_items: generation.approved_items,\n        evaluator_kinds: applicable_evaluator_kinds(generation),\n        candidate_blind: true,\n        carried_calibration_passed: true,\n        uncarried_calibration_passed: true\n    )\n}","when":"FreshSliceGenerationVerificationPassed(generation)","requires":["generation.status = running","generation.harness_snapshot.sealed","generation.harness_snapshot.calibrated","oracle_author_can_read_only_approved_cut_and_public_calibration_protocol(generation)","oracle_author_cannot_read_candidate_or_evaluation_material(generation)","cycle_oracle_contains_only_applicable_behavior_affordance_and_runtime_evaluators(generation)","cycle_oracle_passes_carried_and_uncarried_calibration(generation)"],"ensures":["SealedCycleOracle.created("]},{"name":"RouteApprovedSliceToFreshSliceGeneration","source":"rule RouteApprovedSliceToFreshSliceGeneration {\n    when: ApprovedSliceSubmitted(request)\n    requires: selection_is_approved_and_matches_digest(request)\n    requires: request.operation = fresh_generation\n    requires: request.parent_candidate_identity = null\n    ensures: ApprovedSliceRoute.created(\n        request_identity: request.identity,\n        request_digest: request.digest,\n        project_identity: request.project_identity,\n        container_identity: request.container_identity,\n        component_identity: request.component_identity,\n        selection_identity: request.selection_identity,\n        operation: fresh_generation,\n        parent_candidate_identity: null,\n        parent_candidate_root: null,\n        parent_candidate_digest: null\n    )\n    ensures: FreshSliceGenerationRequested(request)\n}","when":"ApprovedSliceSubmitted(request)","requires":["selection_is_approved_and_matches_digest(request)","request.operation = fresh_generation","request.parent_candidate_identity = null"],"ensures":["ApprovedSliceRoute.created(","FreshSliceGenerationRequested(request)"]},{"name":"StartFreshSliceGeneration","source":"rule StartFreshSliceGeneration {\n    when: ApprovedFreshSliceGenerationRequested(generation)\n    requires: generation.status = requested\n    requires: generation.operation = fresh_generation\n    requires: generation.source_cut.source_commit != \"\"\n    requires: generation.source_cut.tree_digest != \"\"\n    requires: generation.selection_identity != \"\"\n    requires: generation.selection_digest != \"\"\n    requires: generation.approved_items.count > 0\n    requires: generation.workspace_scope.count > 0\n    requires: selection_is_approved_and_matches_digest(generation)\n    requires: source_cut_excludes_prior_implementation_and_measurements(generation.source_cut)\n    requires: generation.harness_snapshot.harness_revision != \"\"\n    requires: generation.harness_snapshot.manifest_digest != \"\"\n    requires: generation.harness_snapshot.sealed\n    requires: generation.harness_snapshot.calibrated\n    ensures: generation.status = running\n}","when":"ApprovedFreshSliceGenerationRequested(generation)","requires":["generation.status = requested","generation.operation = fresh_generation","generation.source_cut.source_commit != \"\"","generation.source_cut.tree_digest != \"\"","generation.selection_identity != \"\"","generation.selection_digest != \"\"","generation.approved_items.count > 0","generation.workspace_scope.count > 0","selection_is_approved_and_matches_digest(generation)","source_cut_excludes_prior_implementation_and_measurements(generation.source_cut)","generation.harness_snapshot.harness_revision != \"\"","generation.harness_snapshot.manifest_digest != \"\"","generation.harness_snapshot.sealed","generation.harness_snapshot.calibrated"],"ensures":["generation.status = running"]},{"name":"ProposeOracleFromSuccessfulGrade","source":"rule ProposeOracleFromSuccessfulGrade {\n    when: FreshSliceGenerationGradeCompleted(generation, grade, scenario_digests)\n    requires: generation.status = running\n    requires: grade.generation = generation\n    requires: grade.cycle_oracle_binding_digest =\n              sealed_cycle_oracle_for(generation).binding_digest\n    requires: grade.subject_digest != \"\"\n    requires: grade.judge_identity != \"\"\n    requires: grade.complete\n    requires: grade.passed\n    requires: grade.instrument_conformance_passed\n    requires: grade.item_verdicts.count = generation.approved_items.count\n    requires: every_approved_item_has_one_pass_with_evidence(\n        generation.approved_items, grade.item_verdicts)\n    requires: grade.normalized_evidence_digest != \"\"\n    ensures: ProductOracleProposal.created(\n        identity: oracle_proposal_identity(generation, grade.normalized_evidence_digest),\n        generation: generation,\n        selection_identity: generation.selection_identity,\n        selection_digest: generation.selection_digest,\n        scenario_digests: scenario_digests,\n        subject_digest: grade.subject_digest,\n        judge_identity: grade.judge_identity,\n        denominator: generation.approved_items.count,\n        normalized_evidence_digest: grade.normalized_evidence_digest,\n        proposal_digest: digest_oracle_proposal(generation, grade, scenario_digests),\n        status: proposed\n    )\n    ensures: generation.status = awaiting_oracle_approval\n}","when":"FreshSliceGenerationGradeCompleted(generation, grade, scenario_digests)","requires":["generation.status = running","grade.generation = generation","grade.cycle_oracle_binding_digest =","grade.subject_digest != \"\"","grade.judge_identity != \"\"","grade.complete","grade.passed","grade.instrument_conformance_passed","grade.item_verdicts.count = generation.approved_items.count","every_approved_item_has_one_pass_with_evidence(","grade.normalized_evidence_digest != \"\""],"ensures":["ProductOracleProposal.created(","generation.status = awaiting_oracle_approval"]},{"name":"ApproveExactOracleProposal","source":"rule ApproveExactOracleProposal {\n    when: OperatorApprovesOracleProposal(operator, proposal, supplied_digest)\n    requires: proposal.status = proposed\n    requires: supplied_digest = proposal.proposal_digest\n    requires: operator != \"\"\n    ensures: proposal.status = approved\n    ensures: PublishProductOracleRequested(proposal, operator)\n}","when":"OperatorApprovesOracleProposal(operator, proposal, supplied_digest)","requires":["proposal.status = proposed","supplied_digest = proposal.proposal_digest","operator != \"\""],"ensures":["proposal.status = approved","PublishProductOracleRequested(proposal, operator)"]},{"name":"RefuseStaleOracleProposalApproval","source":"rule RefuseStaleOracleProposalApproval {\n    when: OperatorApprovesOracleProposal(operator, proposal, supplied_digest)\n    requires: supplied_digest != proposal.proposal_digest\n    ensures: OracleProposalApprovalRefused(proposal, supplied_digest)\n    ensures: proposal.status = proposed\n}","when":"OperatorApprovesOracleProposal(operator, proposal, supplied_digest)","requires":["supplied_digest != proposal.proposal_digest"],"ensures":["OracleProposalApprovalRefused(proposal, supplied_digest)","proposal.status = proposed"]},{"name":"RecordPublishedOracleAndCandidate","source":"rule RecordPublishedOracleAndCandidate {\n    when: ProductOraclePublished(proposal, descriptor_digest, approved_by, published_at,\n                                 session, output_root)\n    requires: proposal.status = approved\n    requires: descriptor_digest != \"\"\n    requires: approved_by != \"\"\n    requires: published_at != \"\"\n    requires: session != \"\"\n    requires: output_root != \"\"\n    ensures: AcceptedProductOracle.created(\n        proposal: proposal,\n        descriptor_digest: descriptor_digest,\n        approved_by: approved_by,\n        published_at: published_at\n    )\n    ensures: GeneratedCandidate.created(\n        generation: proposal.generation,\n        builder_session_identity: session,\n        subject_digest: proposal.subject_digest,\n        output_root: output_root,\n        disposition: baseline_measured,\n        oracle_descriptor_digest: descriptor_digest\n    )\n    ensures: ComponentCandidate.created(\n        identity: proposal.generation.identity,\n        output_root: output_root,\n        subject_digest: proposal.subject_digest,\n        project_identity: proposal.generation.project_identity,\n        container_identity: proposal.generation.container_identity,\n        component_identity: proposal.generation.component_identity,\n        operation: fresh_generation,\n        parent_candidate_identity: null,\n        disposition: baseline_measured,\n        oracle_descriptor_digest: descriptor_digest\n    )\n    ensures: proposal.status = published\n    ensures: proposal.generation.status = oracle_promoted\n}","when":"ProductOraclePublished(proposal, descriptor_digest, approved_by, published_at,","requires":["proposal.status = approved","descriptor_digest != \"\"","approved_by != \"\"","published_at != \"\"","session != \"\"","output_root != \"\""],"ensures":["AcceptedProductOracle.created(","GeneratedCandidate.created(","ComponentCandidate.created(","proposal.status = published","proposal.generation.status = oracle_promoted"]},{"name":"RefuseFailedOrIncompleteGrade","source":"rule RefuseFailedOrIncompleteGrade {\n    when: FreshSliceGenerationGradeCompleted(generation, grade, scenario_digests)\n    requires: generation.status = running\n    requires: not grade.complete or not grade.passed or\n              not grade.instrument_conformance_passed or\n              not every_approved_item_has_one_pass_with_evidence(\n                  generation.approved_items, grade.item_verdicts)\n    ensures: generation.status = failed\n    ensures: generation.failure_reason = \"first black-box grade did not completely pass\"\n    ensures: not exists ProductOracleProposals where generation = generation\n    ensures: not exists GeneratedCandidates where generation = generation\n}","when":"FreshSliceGenerationGradeCompleted(generation, grade, scenario_digests)","requires":["generation.status = running","not grade.complete or not grade.passed or"],"ensures":["generation.status = failed","generation.failure_reason = \"first black-box grade did not completely pass\"","not exists ProductOracleProposals where generation = generation","not exists GeneratedCandidates where generation = generation"]},{"name":"RepairFailedFreshSliceGenerationVerification","source":"rule RepairFailedFreshSliceGenerationVerification {\n    when: FreshSliceGenerationVerificationFailed(generation, candidate, evidence, attempts)\n    requires: generation.status = running\n    requires: evidence != null\n    requires: attempts.count < 3\n    ensures: FreshBuilderSessionRequested(\n        generation: generation,\n        initial_workspace: candidate.output_root,\n        verifier_evidence: evidence,\n        attempt: attempts.count + 1\n    )\n    ensures: no_baseline_grade_or_oracle_evidence_is_shared(generation)\n}","when":"FreshSliceGenerationVerificationFailed(generation, candidate, evidence, attempts)","requires":["generation.status = running","evidence != null","attempts.count < 3"],"ensures":["FreshBuilderSessionRequested(","no_baseline_grade_or_oracle_evidence_is_shared(generation)"]},{"name":"FailEmptyFreshSliceGeneration","source":"rule FailEmptyFreshSliceGeneration {\n    when: FirstBuilderFailed(generation, reason)\n    requires: generation.status = running\n    requires: reason != \"\"\n    ensures: generation.status = failed\n    ensures: generation.failure_reason = reason\n    ensures: not exists ProductOracleProposals where generation = generation\n}","when":"FirstBuilderFailed(generation, reason)","requires":["generation.status = running","reason != \"\""],"ensures":["generation.status = failed","generation.failure_reason = reason","not exists ProductOracleProposals where generation = generation"]},{"name":"RouteApprovedSliceToMeasuredRegeneration","source":"rule RouteApprovedSliceToMeasuredRegeneration {\n    when: ApprovedSliceSubmitted(request)\n    requires: selection_is_approved_and_matches_digest(request)\n    requires: request.operation = measured_regeneration\n    requires: request.parent_candidate_identity != null\n    requires: candidate_named(request.parent_candidate_identity).disposition = baseline_measured or\n              candidate_named(request.parent_candidate_identity).disposition = oracle_measured\n    requires: candidate_named(request.parent_candidate_identity).oracle_descriptor_digest != \"\"\n    ensures: ApprovedSliceRoute.created(\n        request_identity: request.identity,\n        request_digest: request.digest,\n        project_identity: request.project_identity,\n        container_identity: request.container_identity,\n        component_identity: request.component_identity,\n        selection_identity: request.selection_identity,\n        operation: measured_regeneration,\n        parent_candidate_identity: request.parent_candidate_identity,\n        parent_candidate_root: candidate_named(request.parent_candidate_identity).output_root,\n        parent_candidate_digest: candidate_named(request.parent_candidate_identity).subject_digest\n    )\n    ensures: MeasuredRegenerationRequested(\n        request,\n        parent_candidate: candidate_named(request.parent_candidate_identity),\n        product_oracle: accepted_oracle_named(\n            candidate_named(request.parent_candidate_identity).oracle_descriptor_digest))\n}","when":"ApprovedSliceSubmitted(request)","requires":["selection_is_approved_and_matches_digest(request)","request.operation = measured_regeneration","request.parent_candidate_identity != null","candidate_named(request.parent_candidate_identity).disposition = baseline_measured or","candidate_named(request.parent_candidate_identity).oracle_descriptor_digest != \"\""],"ensures":["ApprovedSliceRoute.created(","MeasuredRegenerationRequested("]}],"id":"fresh-slice-generation","openQuestions":[],"invariants":[{"name":"FreshSliceGenerationCandidateRequiresApprovedOracle","source":"invariant FreshSliceGenerationCandidateRequiresApprovedOracle {\n    for candidate in GeneratedCandidates:\n        candidate.generation.operation = fresh_generation and\n        candidate.disposition = baseline_measured and\n        candidate.oracle_descriptor_digest != \"\" and\n        exists AcceptedProductOracles where\n            descriptor_digest = candidate.oracle_descriptor_digest and\n            proposal.generation = candidate.generation\n}"},{"name":"OracleProposalRetainsCompleteProvenance","source":"invariant OracleProposalRetainsCompleteProvenance {\n    for proposal in ProductOracleProposals:\n        proposal.selection_identity != \"\" and\n        proposal.selection_digest != \"\" and\n        proposal.scenario_digests.count = proposal.denominator and\n        proposal.subject_digest != \"\" and\n        proposal.judge_identity != \"\" and\n        proposal.normalized_evidence_digest != \"\" and\n        proposal.proposal_digest != \"\"\n}"},{"name":"FailedFreshSliceGenerationHasNoPromotedCandidate","source":"invariant FailedFreshSliceGenerationHasNoPromotedCandidate {\n    for generation in FreshSliceGenerations:\n        generation.status = failed implies\n            not exists AcceptedProductOracles where proposal.generation = generation and\n            not exists GeneratedCandidates where generation = generation\n}"},{"name":"FreshSliceGenerationHasNoParentCandidate","source":"invariant FreshSliceGenerationHasNoParentCandidate {\n    for generation in FreshSliceGenerations:\n        not has_parent_candidate(generation)\n}"}]},{"description":"Local build contract for the repository-root Pi harness Makefile target. This workflow is distinct from candidate regeneration and requires no oracle.","featureFile":"model/pi-harness/harness-bootstrap.feature","file":"model/pi-harness/harness-bootstrap.allium","surfaces":[{"name":"PiHarnessRuntimeBootstrap","source":"surface PiHarnessRuntimeBootstrap {\n    provides:\n        HarnessBootstrapStarted(bootstrap)\n        HarnessDependenciesInstalled(bootstrap)\n        HarnessRuntimeAssetsBuilt(bootstrap)\n        HarnessRuntimeAssetsVerified(bootstrap)\n        HarnessBootstrapCommandFailed(bootstrap, reason)\n\n    @guarantee OracleIndependentRuntimeSetup\n        -- A fresh sealed harness snapshot can be built and calibrated before any product oracle exists.\n\n    @guarantee HarnessOnlyEffect\n        -- The Makefile target builds harness and supported-stack runtime assets only; it does not build,\n        -- grade, or regenerate the product.\n}","facing":null,"provides":["HarnessBootstrapStarted","HarnessDependenciesInstalled","HarnessRuntimeAssetsBuilt","HarnessRuntimeAssetsVerified","HarnessBootstrapCommandFailed"]}],"entities":[{"name":"HarnessRuntimeBootstrap","source":"entity HarnessRuntimeBootstrap {\n    identity: String\n    makefile: String\n    output_directory: String\n    runtime_assets: List<String>\n    harness_revision: String\n    snapshot_manifest_digest: String?\n    calibration_digest: String?\n    status: HarnessBootstrapStatus\n    failure_reason: String?\n}","external":false}],"rules":[{"name":"InstallHarnessDependencies","source":"rule InstallHarnessDependencies {\n    when: HarnessBootstrapStarted(bootstrap)\n    requires: bootstrap.status = requested\n    requires: bootstrap.makefile = \"harness/Makefile\"\n    requires: bootstrap.output_directory = \".pi/harness/.state/assets\"\n    ensures: bootstrap.status = installing_dependencies\n}","when":"HarnessBootstrapStarted(bootstrap)","requires":["bootstrap.status = requested","bootstrap.makefile = \"harness/Makefile\"","bootstrap.output_directory = \".pi/harness/.state/assets\""],"ensures":["bootstrap.status = installing_dependencies"]},{"name":"BuildHarnessRuntimes","source":"rule BuildHarnessRuntimes {\n    when: HarnessDependenciesInstalled(bootstrap)\n    requires: bootstrap.status = installing_dependencies\n    ensures: bootstrap.status = building_runtimes\n    ensures: docker_build_all_configured_images(bootstrap.makefile)\n    ensures: build_all_gondolin_runtimes(bootstrap.makefile,\n                                        bootstrap.output_directory,\n                                        bootstrap.runtime_assets)\n}","when":"HarnessDependenciesInstalled(bootstrap)","requires":["bootstrap.status = installing_dependencies"],"ensures":["bootstrap.status = building_runtimes","docker_build_all_configured_images(bootstrap.makefile)","build_all_gondolin_runtimes(bootstrap.makefile,"]},{"name":"VerifyHarnessRuntimes","source":"rule VerifyHarnessRuntimes {\n    when: HarnessRuntimeAssetsBuilt(bootstrap)\n    requires: bootstrap.status = building_runtimes\n    ensures: bootstrap.status = verifying_runtimes\n    ensures: verify_all_gondolin_assets(bootstrap.output_directory,\n                                        bootstrap.runtime_assets)\n}","when":"HarnessRuntimeAssetsBuilt(bootstrap)","requires":["bootstrap.status = building_runtimes"],"ensures":["bootstrap.status = verifying_runtimes","verify_all_gondolin_assets(bootstrap.output_directory,"]},{"name":"CompleteHarnessBootstrap","source":"rule CompleteHarnessBootstrap {\n    when: HarnessRuntimeAssetsVerified(bootstrap)\n    requires: bootstrap.status = verifying_runtimes\n    requires: bootstrap.harness_revision != \"\"\n    requires: all_runtime_assets_and_conformance_machinery_are_manifest_bound(bootstrap)\n    requires: carried_and_uncarried_harness_calibration_passes(bootstrap)\n    ensures: bootstrap.snapshot_manifest_digest = digest_harness_snapshot_manifest(bootstrap)\n    ensures: bootstrap.calibration_digest = digest_harness_calibration(bootstrap)\n    ensures: bootstrap.status = completed\n}","when":"HarnessRuntimeAssetsVerified(bootstrap)","requires":["bootstrap.status = verifying_runtimes","bootstrap.harness_revision != \"\"","all_runtime_assets_and_conformance_machinery_are_manifest_bound(bootstrap)","carried_and_uncarried_harness_calibration_passes(bootstrap)"],"ensures":["bootstrap.snapshot_manifest_digest = digest_harness_snapshot_manifest(bootstrap)","bootstrap.calibration_digest = digest_harness_calibration(bootstrap)","bootstrap.status = completed"]},{"name":"FailHarnessBootstrap","source":"rule FailHarnessBootstrap {\n    when: HarnessBootstrapCommandFailed(bootstrap, reason)\n    requires: reason != \"\"\n    ensures: bootstrap.status = failed\n    ensures: bootstrap.failure_reason = reason\n}","when":"HarnessBootstrapCommandFailed(bootstrap, reason)","requires":["reason != \"\""],"ensures":["bootstrap.status = failed","bootstrap.failure_reason = reason"]}],"id":"harness-bootstrap","openQuestions":[],"invariants":[{"name":"HarnessBootstrapDoesNotRequireOracle","source":"invariant HarnessBootstrapDoesNotRequireOracle {\n    for bootstrap in HarnessRuntimeBootstraps:\n        bootstrap.status in {requested, installing_dependencies, building_runtimes,\n                             verifying_runtimes, completed} implies\n            not requires_product_oracle(bootstrap) and\n            not requires_instrument_oracle(bootstrap)\n}"},{"name":"HarnessBootstrapDoesNotRegenerateProduct","source":"invariant HarnessBootstrapDoesNotRegenerateProduct {\n    for bootstrap in HarnessRuntimeBootstraps:\n        bootstrap.status = completed implies\n            not modifies_product_implementation(bootstrap) and\n            not submits_regeneration_cycle(bootstrap) and\n            not publishes_oracle(bootstrap)\n}"}]},{"description":"Observable session-agnostic control-plane behavior. ORC owns task execution events.","featureFile":"model/pi-harness/operator-control-plane.feature","file":"model/pi-harness/operator-control-plane.allium","surfaces":[{"name":"RegenerationControlPlane","source":"surface RegenerationControlPlane {\n    facing operator_session: OperatorSession\n\n    provides:\n        PrepareRegenerationCut(operator_session, request_identity, request_digest, source_commit, backend)\n        ProposeSliceSelection(operator_session, cut_identity, operator_intent)\n        PreviewSliceSelection(operator_session, cut_identity, slice_identity, requested_items)\n        ApproveSliceSelection(operator_session, selection, supplied_digest)\n        PrepareRegenerationCycle(operator_session, preparation_identity, selection,\n                                 candidate_scope, target_stack, execution_profile,\n                                 cut_digest, oracle_digest, diagram_digest, max_outer_cycles)\n        ApprovePreparedCycle(operator_session, preparation, supplied_digest)\n        ApproveOracleProposal(operator_session, proposal, supplied_digest)\n        SubmitRegenerationCycle(operator_session, request_identity, request_digest,\n                                preparation, parent_cycle_identity)\n        WaitRegenerationTask(operator_session, task)\n        QueryCycleProgress(operator_session, cycle_identity)\n        ReadCycleMeasurement(operator_session, cycle_identity)\n        OpenBuilderSession(operator_session, builder_session)\n        InterveneBuilderSession(operator_session, builder_session, intervention_kind)\n        PrepareChildCycle(operator_session, parent_task, child_preparation, reason)\n\n    @guarantee DurableTaskObservation\n        -- A replacement worker reconstructs a known task outcome from ORC state and never reruns it to answer a wait.\n\n    @guarantee RefusalBeforeExecution\n        -- Invalid identities, selections, scopes, and backends are refused before builder work begins.\n\n    @guarantee SessionAgnosticControl\n        -- ORC cycle state outlives the Codex, Pi, or other operator session that requested it.\n\n    @guarantee ExploratorySessionOwnership\n        -- Skills, dynamic tools, branching, and human steering remain in the operator session.\n\n    @guarantee ImmutableHandoff\n        -- Only the approved preparation crosses into ORC; the exploratory transcript never becomes builder input.\n\n    @guarantee FixedContractOwnership\n        -- ORC owns bounded prompt execution, constrained tools, retries, termination, grading, and measurement.\n\n    @guarantee ObservableNotAuthoritative\n        -- Live notifications and builder-session views aid operators but never advance ORC state.\n}","facing":"operator_session","provides":["PrepareRegenerationCut","ProposeSliceSelection","PreviewSliceSelection","ApproveSliceSelection","PrepareRegenerationCycle","ApprovePreparedCycle","ApproveOracleProposal","SubmitRegenerationCycle","WaitRegenerationTask","QueryCycleProgress","ReadCycleMeasurement","OpenBuilderSession","InterveneBuilderSession","PrepareChildCycle"]}],"entities":[{"name":"ControlSelection","source":"entity ControlSelection {\n    identity: String\n    digest: SelectionDigest\n    status: ControlSelectionStatus\n    cut_identity: String\n    items: List<SelectedItemContract>\n\n    transitions status {\n        awaiting_approval -> approved\n        terminal: approved\n    }\n}","external":false},{"name":"CyclePreparation","source":"entity CyclePreparation {\n    identity: String\n    digest: PreparationDigest\n    status: PreparationStatus\n    selection: ControlSelection\n    candidate_scope: List<String>\n    target_stack: String\n    execution_profile: ExecutionProfile\n    cut_digest: String\n    oracle_digest: String\n    diagram_digest: String\n    max_outer_cycles: Integer\n\n    transitions status {\n        awaiting_approval -> approved\n        terminal: approved\n    }\n}","external":false},{"name":"HarnessTask","source":"entity HarnessTask {\n    identity: String\n    kind: HarnessTaskKind\n    request_identity: String\n    request_digest: RequestDigest\n    status: HarnessTaskStatus\n    trace_identity: String?\n    outcome: String?\n    preparation_identity: String?\n    parent_cycle_identity: String?\n\n    transitions status {\n        submitted -> running\n        running -> completed\n        running -> failed\n        terminal: completed, failed\n    }\n}","external":false},{"name":"CycleProgressView","source":"entity CycleProgressView {\n    cycle_identity: String\n    trace_identity: String\n    stage: String\n    status: HarnessTaskStatus\n    builder_session_identity: String?\n    durable_cursor: String?\n}","external":false},{"name":"BuilderSessionReference","source":"entity BuilderSessionReference {\n    identity: String\n    cycle_identity: String\n    operation_identity: String\n    stage: String\n    attempt: Integer\n    status: BuilderSessionStatus\n    workspace_generation: String?\n    assisted: Boolean\n}","external":false},{"name":"DurableMeasurementReceipt","source":"entity DurableMeasurementReceipt {\n    cycle_identity: String\n    selection_identity: String\n    total: Integer\n    passed: Integer\n    failed: Integer\n    complete: Boolean\n}","external":false},{"name":"ControlOracleProposal","source":"entity ControlOracleProposal {\n    identity: String\n    digest: String\n    status: ControlOracleProposalStatus\n\n    transitions status {\n        proposed -> approved\n        approved -> published\n        terminal: published\n    }\n}","external":false},{"name":"OperatorSession","source":"external entity OperatorSession {}\n\nenum HarnessTaskKind { cut_preparation | regeneration_cycle }\nenum HarnessTaskStatus { submitted | running | completed | failed }\nenum ControlSelectionStatus { awaiting_approval | approved }\nenum PreparationStatus { awaiting_approval | approved }\nenum ExecutionProfile { host_development | gondolin_isolated | automatic }\nenum BuilderSessionStatus { opening | active | paused | completed | failed }\nenum InterventionKind { pause | steer | fork }\nenum ControlOracleProposalStatus { proposed | approved | published }\n\nvalue RequestDigest { value: String }\nvalue SelectionDigest { value: String }\nvalue PreparationDigest { value: String }\nvalue SelectedItemContract { identity: String, scenario_digest: String }\n\nentity ControlSelection {\n    identity: String\n    digest: SelectionDigest\n    status: ControlSelectionStatus\n    cut_identity: String\n    items: List<SelectedItemContract>\n\n    transitions status {\n        awaiting_approval -> approved\n        terminal: approved\n    }\n}","external":true}],"rules":[{"name":"ValidateHarnessGrainServiceArea","source":"rule ValidateHarnessGrainServiceArea {\n    when: StartPiHarnessGrainServiceArea(runtime)\n    requires: runtime = orc_grain_runtime()\n    requires: registered_service_area_loaded(\":loyly.pi-harness\")\n    requires: strict_event_model_matches_live_registries(runtime, \":loyly.pi-harness\")\n    requires: every_required_allium_trace_link_resolves(\":loyly.pi-harness\")\n    ensures: PiHarnessControlPlaneAvailable(runtime: runtime)\n}","when":"StartPiHarnessGrainServiceArea(runtime)","requires":["runtime = orc_grain_runtime()","registered_service_area_loaded(\":loyly.pi-harness\")","strict_event_model_matches_live_registries(runtime, \":loyly.pi-harness\")","every_required_allium_trace_link_resolves(\":loyly.pi-harness\")"],"ensures":["PiHarnessControlPlaneAvailable(runtime: runtime)"]},{"name":"DispatchApprovedPreparationToOrc","source":"rule DispatchApprovedPreparationToOrc {\n    when: CyclePreparationApproved(preparation)\n    requires: preparation.status = approved\n    requires: not orc_tick_dispatched_for(preparation.identity)\n    ensures: OrcGrainCommandDispatched(\n        preparation_identity: preparation.identity,\n        command_identity: deterministic_orc_command_identity(preparation),\n        preparation_digest: preparation.digest\n    )\n}","when":"CyclePreparationApproved(preparation)","requires":["preparation.status = approved","not orc_tick_dispatched_for(preparation.identity)"],"ensures":["OrcGrainCommandDispatched("]},{"name":"PrepareCutTask","source":"rule PrepareCutTask {\n    when: PrepareRegenerationCut(operator_session, request_identity, request_digest, source_commit, backend)\n    requires: full_source_commit(source_commit)\n    requires: supported_backend(backend)\n    requires: not exists HarnessTask{request_identity: request_identity}\n    ensures: HarnessTask.created(\n        identity: next_task_identity(),\n        kind: cut_preparation,\n        request_identity: request_identity,\n        request_digest: request_digest,\n        status: submitted,\n        trace_identity: null,\n        outcome: null\n    )\n}","when":"PrepareRegenerationCut(operator_session, request_identity, request_digest, source_commit, backend)","requires":["full_source_commit(source_commit)","supported_backend(backend)","not exists HarnessTask{request_identity: request_identity}"],"ensures":["HarnessTask.created("]},{"name":"PreviewControlSelection","source":"rule PreviewControlSelection {\n    when: PreviewSliceSelection(operator_session, cut_identity, slice_identity, requested_items)\n    requires: slice_identity in valid_system_composition(cut_identity)\n    let resolved_items = resolve_items_once(cut_identity, slice_identity, requested_items)\n    requires: resolved_items.count > 0\n    ensures: ControlSelection.created(\n        identity: deterministic_selection_identity(cut_identity, slice_identity, resolved_items),\n        digest: deterministic_selection_digest(cut_identity, slice_identity, resolved_items),\n        status: awaiting_approval,\n        cut_identity: cut_identity,\n        items: resolved_items\n    )\n}","when":"PreviewSliceSelection(operator_session, cut_identity, slice_identity, requested_items)","requires":["slice_identity in valid_system_composition(cut_identity)","resolved_items.count > 0"],"ensures":["ControlSelection.created("]},{"name":"ProposeControlSelectionFromIntent","source":"rule ProposeControlSelectionFromIntent {\n    when: ProposeSliceSelection(operator_session, cut_identity, operator_intent)\n    requires: operator_session_owns_exploratory_transcript(operator_session)\n    let proposed_scope = llm_propose_existing_slice_and_items(cut_identity, operator_intent)\n    requires: proposed_scope.belongs_to(valid_system_composition(cut_identity))\n    let resolved_items = resolve_items_once(\n        cut_identity, proposed_scope.slice_identity, proposed_scope.item_identities)\n    requires: resolved_items.count > 0\n    ensures: ControlSelection.created(\n        identity: deterministic_selection_identity(\n            cut_identity, proposed_scope.slice_identity, resolved_items),\n        digest: deterministic_selection_digest(\n            cut_identity, proposed_scope.slice_identity, resolved_items),\n        status: awaiting_approval,\n        cut_identity: cut_identity,\n        items: resolved_items\n    )\n}","when":"ProposeSliceSelection(operator_session, cut_identity, operator_intent)","requires":["operator_session_owns_exploratory_transcript(operator_session)","proposed_scope.belongs_to(valid_system_composition(cut_identity))","resolved_items.count > 0"],"ensures":["ControlSelection.created("]},{"name":"ApproveControlSelection","source":"rule ApproveControlSelection {\n    when: ApproveSliceSelection(operator_session, selection, supplied_digest)\n    requires: selection.status = awaiting_approval\n    requires: supplied_digest = selection.digest\n    ensures: selection.status = approved\n}","when":"ApproveSliceSelection(operator_session, selection, supplied_digest)","requires":["selection.status = awaiting_approval","supplied_digest = selection.digest"],"ensures":["selection.status = approved"]},{"name":"PrepareCycle","source":"rule PrepareCycle {\n    when: PrepareRegenerationCycle(operator_session, preparation_identity, selection,\n                                   candidate_scope, target_stack, execution_profile,\n                                   cut_digest, oracle_digest, diagram_digest, max_outer_cycles)\n    requires: selection.status = approved\n    requires: safe_candidate_scope(candidate_scope)\n    requires: supported_execution_profile(execution_profile)\n    requires: max_outer_cycles > 0\n    ensures: CyclePreparation.created(\n        identity: preparation_identity,\n        digest: deterministic_preparation_digest(\n            selection, candidate_scope, target_stack, execution_profile,\n            cut_digest, oracle_digest, diagram_digest, max_outer_cycles),\n        status: awaiting_approval,\n        selection: selection,\n        candidate_scope: candidate_scope,\n        target_stack: target_stack,\n        execution_profile: execution_profile,\n        cut_digest: cut_digest,\n        oracle_digest: oracle_digest,\n        diagram_digest: diagram_digest,\n        max_outer_cycles: max_outer_cycles\n    )\n}","when":"PrepareRegenerationCycle(operator_session, preparation_identity, selection,","requires":["selection.status = approved","safe_candidate_scope(candidate_scope)","supported_execution_profile(execution_profile)","max_outer_cycles > 0"],"ensures":["CyclePreparation.created("]},{"name":"ApproveCyclePreparation","source":"rule ApproveCyclePreparation {\n    when: ApprovePreparedCycle(operator_session, preparation, supplied_digest)\n    requires: preparation.status = awaiting_approval\n    requires: supplied_digest = preparation.digest\n    ensures: preparation.status = approved\n}","when":"ApprovePreparedCycle(operator_session, preparation, supplied_digest)","requires":["preparation.status = awaiting_approval","supplied_digest = preparation.digest"],"ensures":["preparation.status = approved"]},{"name":"ApproveExactOracleProposal","source":"rule ApproveExactOracleProposal {\n    when: ApproveOracleProposal(operator_session, proposal, supplied_digest)\n    requires: proposal.status = proposed\n    requires: supplied_digest = proposal.digest\n    ensures: proposal.status = approved\n    ensures: ImmutableProductOraclePublicationRequested(proposal: proposal)\n}","when":"ApproveOracleProposal(operator_session, proposal, supplied_digest)","requires":["proposal.status = proposed","supplied_digest = proposal.digest"],"ensures":["proposal.status = approved","ImmutableProductOraclePublicationRequested(proposal: proposal)"]},{"name":"SubmitCycleTask","source":"rule SubmitCycleTask {\n    when: SubmitRegenerationCycle(operator_session, request_identity, request_digest,\n                                  preparation, parent_cycle_identity)\n    requires: preparation.status = approved\n    requires: fixed_bounded_execution_contract(preparation)\n    requires: preparation.selection.items.count > 0\n    requires: not exists HarnessTask{request_identity: request_identity}\n    ensures: HarnessTask.created(\n        identity: next_task_identity(),\n        kind: regeneration_cycle,\n        request_identity: request_identity,\n        request_digest: request_digest,\n        status: submitted,\n        trace_identity: null,\n        outcome: null,\n        preparation_identity: preparation.identity,\n        parent_cycle_identity: parent_cycle_identity\n    )\n}","when":"SubmitRegenerationCycle(operator_session, request_identity, request_digest,","requires":["preparation.status = approved","fixed_bounded_execution_contract(preparation)","preparation.selection.items.count > 0","not exists HarnessTask{request_identity: request_identity}"],"ensures":["HarnessTask.created("]},{"name":"RepeatIdenticalSubmission","source":"rule RepeatIdenticalSubmission {\n    when: RepeatRegenerationSubmission(operator_session, task, supplied_digest)\n    requires: task.kind = regeneration_cycle\n    requires: supplied_digest = task.request_digest\n    ensures: ExistingTaskReceiptReturned(task: task)\n}","when":"RepeatRegenerationSubmission(operator_session, task, supplied_digest)","requires":["task.kind = regeneration_cycle","supplied_digest = task.request_digest"],"ensures":["ExistingTaskReceiptReturned(task: task)"]},{"name":"RefuseConflictingSubmission","source":"rule RefuseConflictingSubmission {\n    when: RepeatRegenerationSubmission(operator_session, task, different_digest)\n    requires: different_digest != task.request_digest\n    ensures: SubmissionRefused(reason: \"request identity conflict\")\n}","when":"RepeatRegenerationSubmission(operator_session, task, different_digest)","requires":["different_digest != task.request_digest"],"ensures":["SubmissionRefused(reason: \"request identity conflict\")"]},{"name":"StartHarnessTask","source":"rule StartHarnessTask {\n    when: OrcTaskStarted(task, trace_identity)\n    requires: task.status = submitted\n    ensures: task.status = running\n    ensures: task.trace_identity = trace_identity\n}","when":"OrcTaskStarted(task, trace_identity)","requires":["task.status = submitted"],"ensures":["task.status = running","task.trace_identity = trace_identity"]},{"name":"CompleteHarnessTask","source":"rule CompleteHarnessTask {\n    when: OrcTaskCompleted(task, outcome)\n    requires: task.status = running\n    ensures: task.status = completed\n    ensures: task.outcome = outcome\n}","when":"OrcTaskCompleted(task, outcome)","requires":["task.status = running"],"ensures":["task.status = completed","task.outcome = outcome"]},{"name":"FailHarnessTask","source":"rule FailHarnessTask {\n    when: OrcTaskFailed(task, stage, reason)\n    requires: task.status = running\n    ensures: task.status = failed\n    ensures: task.outcome = terminal_failure(stage, reason)\n}","when":"OrcTaskFailed(task, stage, reason)","requires":["task.status = running"],"ensures":["task.status = failed","task.outcome = terminal_failure(stage, reason)"]},{"name":"WaitForHarnessTask","source":"rule WaitForHarnessTask {\n    when: WaitRegenerationTask(operator_session, task)\n    requires: task.status = completed or task.status = failed\n    ensures: TerminalTaskOutcomeReturned(task: task)\n}","when":"WaitRegenerationTask(operator_session, task)","requires":["task.status = completed or task.status = failed"],"ensures":["TerminalTaskOutcomeReturned(task: task)"]},{"name":"ReadDurableMeasurement","source":"rule ReadDurableMeasurement {\n    when: ReadCycleMeasurement(operator_session, cycle_identity)\n    requires: exists DurableMeasurementReceipt{cycle_identity: cycle_identity}\n    ensures: DurableMeasurementReturned(cycle_identity: cycle_identity)\n}","when":"ReadCycleMeasurement(operator_session, cycle_identity)","requires":["exists DurableMeasurementReceipt{cycle_identity: cycle_identity}"],"ensures":["DurableMeasurementReturned(cycle_identity: cycle_identity)"]},{"name":"ProjectCycleProgress","source":"rule ProjectCycleProgress {\n    when: OrcExecutionEventProjected(task, stage, status, builder_session_identity, durable_cursor)\n    requires: task.kind = regeneration_cycle\n    requires: task.trace_identity != null\n    ensures: CycleProgressProjected(\n        cycle_identity: task.request_identity,\n        trace_identity: task.trace_identity,\n        stage: stage,\n        status: status,\n        builder_session_identity: builder_session_identity,\n        durable_cursor: durable_cursor\n    )\n}","when":"OrcExecutionEventProjected(task, stage, status, builder_session_identity, durable_cursor)","requires":["task.kind = regeneration_cycle","task.trace_identity != null"],"ensures":["CycleProgressProjected("]},{"name":"ReadCycleProgress","source":"rule ReadCycleProgress {\n    when: QueryCycleProgress(operator_session, cycle_identity)\n    requires: exists CycleProgressView{cycle_identity: cycle_identity}\n    ensures: ReconciledCycleProgressReturned(cycle_identity: cycle_identity)\n}","when":"QueryCycleProgress(operator_session, cycle_identity)","requires":["exists CycleProgressView{cycle_identity: cycle_identity}"],"ensures":["ReconciledCycleProgressReturned(cycle_identity: cycle_identity)"]},{"name":"RegisterBuilderSessionReference","source":"rule RegisterBuilderSessionReference {\n    when: OrcBuilderSessionOpened(task, identity, operation_identity, stage, attempt)\n    requires: task.kind = regeneration_cycle\n    requires: task.status = running\n    requires: not exists BuilderSessionReference{operation_identity: operation_identity}\n    ensures: BuilderSessionReference.created(\n        identity: identity,\n        cycle_identity: task.request_identity,\n        operation_identity: operation_identity,\n        stage: stage,\n        attempt: attempt,\n        status: opening,\n        workspace_generation: null,\n        assisted: false\n    )\n}","when":"OrcBuilderSessionOpened(task, identity, operation_identity, stage, attempt)","requires":["task.kind = regeneration_cycle","task.status = running","not exists BuilderSessionReference{operation_identity: operation_identity}"],"ensures":["BuilderSessionReference.created("]},{"name":"UpdateBuilderSessionReference","source":"rule UpdateBuilderSessionReference {\n    when: OrcBuilderSessionStateObserved(builder_session, status, workspace_generation)\n    ensures: builder_session.status = status\n    ensures: builder_session.workspace_generation = workspace_generation\n}","when":"OrcBuilderSessionStateObserved(builder_session, status, workspace_generation)","requires":[],"ensures":["builder_session.status = status","builder_session.workspace_generation = workspace_generation"]},{"name":"ObserveBuilderSession","source":"rule ObserveBuilderSession {\n    when: OpenBuilderSession(operator_session, builder_session)\n    ensures: ReadOnlyBuilderSessionViewReturned(\n        builder_session_identity: builder_session.identity,\n        operation_identity: builder_session.operation_identity,\n        workspace_generation: builder_session.workspace_generation\n    )\n    ensures: builder_session.assisted = builder_session.assisted\n}","when":"OpenBuilderSession(operator_session, builder_session)","requires":[],"ensures":["ReadOnlyBuilderSessionViewReturned(","builder_session.assisted = builder_session.assisted"]},{"name":"InterveneInBuilderSession","source":"rule InterveneInBuilderSession {\n    when: InterveneBuilderSession(operator_session, builder_session, intervention_kind)\n    requires: safe_intervention_boundary(builder_session, intervention_kind)\n    ensures: BuilderInterventionRecorded(\n        builder_session_identity: builder_session.identity,\n        kind: intervention_kind\n    )\n    ensures: ResultingBuilderWorkMarkedAssisted(builder_session: builder_session)\n}","when":"InterveneBuilderSession(operator_session, builder_session, intervention_kind)","requires":["safe_intervention_boundary(builder_session, intervention_kind)"],"ensures":["BuilderInterventionRecorded(","ResultingBuilderWorkMarkedAssisted(builder_session: builder_session)"]},{"name":"ContinueWithChildCycle","source":"rule ContinueWithChildCycle {\n    when: PrepareChildCycle(operator_session, parent_task, child_preparation, reason)\n    requires: parent_task.status = completed or parent_task.status = failed\n    requires: child_preparation.status = approved\n    requires: within_outer_cycle_budget(parent_task, child_preparation)\n    ensures: ChildCycleLineageRecorded(\n        parent_cycle_identity: parent_task.request_identity,\n        preparation_identity: child_preparation.identity,\n        reason: reason\n    )\n}","when":"PrepareChildCycle(operator_session, parent_task, child_preparation, reason)","requires":["parent_task.status = completed or parent_task.status = failed","child_preparation.status = approved","within_outer_cycle_budget(parent_task, child_preparation)"],"ensures":["ChildCycleLineageRecorded("]}],"id":"operator-control-plane","openQuestions":[],"invariants":[{"name":"HarnessDoesNotDuplicateOrcExecutionFacts","source":"invariant HarnessDoesNotDuplicateOrcExecutionFacts {\n    for progress in CycleProgressViews:\n        projection_source(progress) = authoritative_orc_sheet_events(progress.trace_identity) and\n        not exists HarnessProgressEvent{cycle_identity: progress.cycle_identity}\n}"},{"name":"OneRequestNamesOneTask","source":"invariant OneRequestNamesOneTask {\n    for task in HarnessTasks:\n        count(HarnessTasks where request_identity = task.request_identity) = 1\n}"},{"name":"TerminalOutcomeIsStable","source":"invariant TerminalOutcomeIsStable {\n    for task in HarnessTasks:\n        task.status = completed or task.status = failed implies task.outcome != null\n}"},{"name":"ApprovedPreparationDigestIsStable","source":"invariant ApprovedPreparationDigestIsStable {\n    for preparation in CyclePreparations:\n        preparation.status = approved implies\n            preparation.digest = deterministic_preparation_digest(\n                preparation.selection,\n                preparation.candidate_scope,\n                preparation.target_stack,\n                preparation.execution_profile,\n                preparation.cut_digest,\n                preparation.oracle_digest,\n                preparation.diagram_digest,\n                preparation.max_outer_cycles)\n}"},{"name":"ProgressViewIsNotWorkflowAuthority","source":"invariant ProgressViewIsNotWorkflowAuthority {\n    for progress in CycleProgressViews:\n        progress.status = projected_orc_task_status(progress.trace_identity)\n}"},{"name":"BuilderObservationDoesNotAssist","source":"invariant BuilderObservationDoesNotAssist {\n    for builder_session in BuilderSessionReferences:\n        read_only_observation(builder_session.identity) implies\n            builder_session.assisted = prior_assisted_state(builder_session.identity)\n}"}]},{"description":"Project runtime files are resolved by convention, not a duplicate profile JSON. Product truth remains in model/<project-id>; shared harness config remains in .pi/harness/config.","featureFile":"model/pi-harness/project-vm-config.feature","file":"model/pi-harness/project-vm-config.allium","surfaces":[{"name":"ProjectRuntimeConfiguration","source":"surface ProjectRuntimeConfiguration {\n    provides:\n        ProjectRuntimeRequested(project_identity, target_stack)\n        ProjectRuntimeResolutionRefused(project_identity, target_stack)\n\n    @guarantee ProjectLocalBuildInputs\n        -- VM config and supported-stack Dockerfiles resolve from harness/<project-id>/.\n\n    @guarantee NoProfileDuplication\n        -- Paths and stack filenames derive from project identity and the supported-stack registry.\n\n    @guarantee FailClosedStackResolution\n        -- Missing or unsupported stack inputs refuse resolution; another project is never substituted.\n}","facing":null,"provides":["ProjectRuntimeRequested","ProjectRuntimeResolutionRefused"]}],"entities":[{"name":"ProjectRuntimeFiles","source":"entity ProjectRuntimeFiles {\n    project_identity: String\n    gondolin_vm_config: String\n    stack_dockerfiles: Map<String, String>\n}","external":false},{"name":"ResolvedProjectRuntime","source":"entity ResolvedProjectRuntime {\n    files: ProjectRuntimeFiles\n    target_stack: String\n    dockerfile: String\n    resolution: ProjectRuntimeResolution\n}","external":false}],"rules":[{"name":"ResolveProjectRuntime","source":"rule ResolveProjectRuntime {\n    when: ProjectRuntimeRequested(project_identity, target_stack)\n    requires: project_identity != \"\"\n    let project_dir = \"harness/\" + project_identity\n    let vm_config = project_dir + \"/gondolin.json\"\n    let stack_dockerfiles = conventional_stack_dockerfiles(project_dir)\n    requires: file_exists(vm_config)\n    requires: exists stack_dockerfiles[target_stack]\n    requires: file_is_within_project_dir(stack_dockerfiles[target_stack], project_dir)\n    ensures: ProjectRuntimeFiles.created(\n        project_identity: project_identity,\n        gondolin_vm_config: vm_config,\n        stack_dockerfiles: stack_dockerfiles\n    )\n    ensures: ResolvedProjectRuntime.created(\n        files: last_created_project_runtime_files(project_identity),\n        target_stack: target_stack,\n        dockerfile: stack_dockerfiles[target_stack],\n        resolution: resolved\n    )\n}","when":"ProjectRuntimeRequested(project_identity, target_stack)","requires":["project_identity != \"\"","file_exists(vm_config)","exists stack_dockerfiles[target_stack]","file_is_within_project_dir(stack_dockerfiles[target_stack], project_dir)"],"ensures":["ProjectRuntimeFiles.created(","ResolvedProjectRuntime.created("]},{"name":"RefuseMissingProjectRuntime","source":"rule RefuseMissingProjectRuntime {\n    when: ProjectRuntimeRequested(project_identity, target_stack)\n    requires: project_identity != \"\"\n    requires: not file_exists(\"harness/\" + project_identity + \"/Dockerfile.\" + target_stack)\n    ensures: ProjectRuntimeResolutionRefused(project_identity, target_stack)\n}","when":"ProjectRuntimeRequested(project_identity, target_stack)","requires":["project_identity != \"\"","not file_exists(\"harness/\" + project_identity + \"/Dockerfile.\" + target_stack)"],"ensures":["ProjectRuntimeResolutionRefused(project_identity, target_stack)"]}],"id":"project-vm-config","openQuestions":[],"invariants":[{"name":"ProjectRuntimeNeverFallsBackAcrossProjects","source":"invariant ProjectRuntimeNeverFallsBackAcrossProjects {\n    for runtime in ResolvedProjectRuntimes:\n        runtime.dockerfile starts_with (\"harness/\" + runtime.files.project_identity + \"/\")\n}"}]},{"description":"ORC-owned optimization of complete builder strategies through independent purpose-specific regeneration measurements.","featureFile":"model/pi-harness/prompt-optimization.feature","file":"model/pi-harness/prompt-optimization.allium","surfaces":[{"name":"BuilderPromptOptimization","source":"surface BuilderPromptOptimization {\n    facing operator: HarnessOperator\n\n    provides:\n        OptimizeBuilderInstruction(\n            operator,\n            optimization_identity,\n            purpose,\n            reflection_provider,\n            reflection_model,\n            training_examples,\n            validation_examples\n        )\n\n    @guarantee OrcOwnsCompleteProductionInstruction\n        -- GEPA mutates the complete model-directed strategy for one named purpose.\n        -- Runtime facts are rendered separately and no adapter adds hidden strategy text.\n\n    @guarantee IndependentPurposeSpecificMetric\n        -- Fresh-generation candidates are measured from a fresh approved cut. Repair\n        -- candidates are measured against fixed failed-verification inputs. Neither\n        -- purpose is credited for behavior supplied by the other instruction.\n\n    @guarantee ExactPromptTransport\n        -- ORC owns system and task instructions for builders and the cycle-oracle\n        -- grader author, renders them with deterministic runtime facts, and records\n        -- the exact digest. The adapter transports it without adding prompt text.\n\n    @guarantee DeterministicEnforcement\n        -- Filesystem scope, network isolation, credentials, stack, Compose topology,\n        -- health, test discovery, affordances, and evidence contracts remain enforced\n        -- by rooms and verifiers even if a model ignores its instructions.\n\n    @guarantee DurableInstructionActivation\n        -- A selected instruction remains recoverable by purpose after process restart;\n        -- process-local memory is never the authority for the active instruction.\n\n    @guarantee BedrockReflection\n        -- Every proposal binds the exact Bedrock provider, model, prompt/response call\n        -- evidence, and usage. AWS credentials never enter prompts or durable evidence.\n\n    @guarantee ReflectionAndExecutionRolesAreSeparate\n        -- Bedrock proposes GEPA instruction candidates. A fresh fenced Pi/Codex builder\n        -- executes them, and the independent grader remains outside both roles.\n\n    @guarantee IndependentOptimizationMetric\n        -- A builder cannot provide or alter verification, grading, evidence collection,\n        -- or the complete-denominator measurement used to score its instruction.\n}","facing":"operator","provides":["OptimizeBuilderInstruction"]}],"entities":[{"name":"BuilderInstruction","source":"entity BuilderInstruction {\n    identity: String\n    purpose: BuilderInstructionPurpose\n    text_digest: String\n    active: Boolean\n}","external":false},{"name":"ReflectionModelBinding","source":"entity ReflectionModelBinding {\n    provider: String\n    model: String\n}","external":false},{"name":"ProductionPrompt","source":"entity ProductionPrompt {\n    identity: String\n    role: ProductionPromptRole\n    system_instruction_digest: String\n    task_instruction_digest: String\n    runtime_context_digest: String\n    rendered_prompt_digest: String\n}","external":false},{"name":"PromptOptimization","source":"entity PromptOptimization {\n    identity: String\n    purpose: BuilderInstructionPurpose\n    status: PromptOptimizationStatus\n    reflection: ReflectionModelBinding\n    training_examples: List<String>\n    validation_examples: List<String>\n    winning_instruction: BuilderInstruction?\n\n    transitions status {\n        evaluating -> optimized\n        evaluating -> failed\n        terminal: optimized, failed\n    }\n}","external":false},{"name":"InstructionCandidate","source":"entity InstructionCandidate {\n    identity: String\n    optimization: PromptOptimization\n    instruction: BuilderInstruction\n    status: InstructionCandidateStatus\n    proposal_call_digest: String\n    executed_prompt_digest: String?\n    independent_score: Decimal?\n    metric_evidence: String?\n\n    transitions status {\n        proposed -> measured\n        proposed -> rejected\n        measured -> selected\n        measured -> rejected\n        terminal: rejected, selected\n    }\n}","external":false},{"name":"HarnessOperator","source":"external entity HarnessOperator {}\n\nenum PromptOptimizationStatus { evaluating | optimized | failed }\nenum InstructionCandidateStatus { proposed | measured | rejected | selected }\nenum BuilderInstructionPurpose { fresh_generation | verification_repair }\nenum ProductionPromptRole { fresh_generation_builder | verification_repair_builder | cycle_oracle_grader_author }\n\nentity BuilderInstruction {\n    identity: String\n    purpose: BuilderInstructionPurpose\n    text_digest: String\n    active: Boolean\n}","external":true}],"rules":[{"name":"RenderProductionPrompt","source":"rule RenderProductionPrompt {\n    when: OrcRendersProductionPrompt(\n        role,\n        system_instruction_digest,\n        task_instruction_digest,\n        runtime_context_digest\n    )\n    requires: system_instruction_digest != \"\"\n    requires: task_instruction_digest != \"\"\n    requires: runtime_context_digest != \"\"\n    ensures: ProductionPrompt.created(\n        identity: deterministic_prompt_identity(\n            role,\n            system_instruction_digest,\n            task_instruction_digest,\n            runtime_context_digest\n        ),\n        role: role,\n        system_instruction_digest: system_instruction_digest,\n        task_instruction_digest: task_instruction_digest,\n        runtime_context_digest: runtime_context_digest,\n        rendered_prompt_digest: deterministic_rendered_prompt_digest(\n            system_instruction_digest,\n            task_instruction_digest,\n            runtime_context_digest\n        )\n    )\n}","when":"OrcRendersProductionPrompt(","requires":["system_instruction_digest != \"\"","task_instruction_digest != \"\"","runtime_context_digest != \"\""],"ensures":["ProductionPrompt.created("]},{"name":"StartPromptOptimization","source":"rule StartPromptOptimization {\n    when: OptimizeBuilderInstruction(\n        operator,\n        optimization_identity,\n        purpose,\n        reflection_provider,\n        reflection_model,\n        training_examples,\n        validation_examples\n    )\n    requires: reflection_provider = \"bedrock\"\n    requires: reflection_model != \"\"\n    requires: training_examples.count > 0\n    requires: validation_examples.count > 0\n    ensures: PromptOptimization.created(\n        identity: optimization_identity,\n        purpose: purpose,\n        status: evaluating,\n        reflection: ReflectionModelBinding{\n            provider: reflection_provider,\n            model: reflection_model\n        },\n        training_examples: training_examples,\n        validation_examples: validation_examples,\n        winning_instruction: null\n    )\n}","when":"OptimizeBuilderInstruction(","requires":["reflection_provider = \"bedrock\"","reflection_model != \"\"","training_examples.count > 0","validation_examples.count > 0"],"ensures":["PromptOptimization.created("]},{"name":"ProposeInstructionCandidate","source":"rule ProposeInstructionCandidate {\n    when: OrcProposedInstruction(\n        optimization,\n        candidate_identity,\n        instruction,\n        reflection_provider,\n        reflection_model,\n        proposal_call_digest\n    )\n    requires: optimization.status = evaluating\n    requires: instruction.purpose = optimization.purpose\n    requires: reflection_provider = optimization.reflection.provider\n    requires: reflection_model = optimization.reflection.model\n    requires: proposal_call_digest != \"\"\n    ensures: InstructionCandidate.created(\n        identity: candidate_identity,\n        optimization: optimization,\n        instruction: instruction,\n        status: proposed,\n        proposal_call_digest: proposal_call_digest,\n        executed_prompt_digest: null,\n        independent_score: null,\n        metric_evidence: null\n    )\n}","when":"OrcProposedInstruction(","requires":["optimization.status = evaluating","instruction.purpose = optimization.purpose","reflection_provider = optimization.reflection.provider","reflection_model = optimization.reflection.model","proposal_call_digest != \"\""],"ensures":["InstructionCandidate.created("]},{"name":"MeasureInstructionCandidate","source":"rule MeasureInstructionCandidate {\n    when: IndependentBuilderInstructionMetricReturned(\n        candidate,\n        production_prompt,\n        score,\n        evidence\n    )\n    requires: candidate.status = proposed\n    requires: production_prompt.role = builder_prompt_role(candidate.instruction.purpose)\n    requires: production_prompt.task_instruction_digest = candidate.instruction.text_digest\n    requires: adapter_transported_prompt_without_mutation(production_prompt.rendered_prompt_digest)\n    requires: purpose_specific_independent_measurement(\n        candidate.instruction.purpose,\n        evidence\n    )\n    requires: evidence_includes_fresh_builder_verification_and_complete_black_box_grade(evidence)\n    ensures: candidate.status = measured\n    ensures: candidate.executed_prompt_digest = production_prompt.rendered_prompt_digest\n    ensures: candidate.independent_score = score\n    ensures: candidate.metric_evidence = evidence\n}","when":"IndependentBuilderInstructionMetricReturned(","requires":["candidate.status = proposed","production_prompt.role = builder_prompt_role(candidate.instruction.purpose)","production_prompt.task_instruction_digest = candidate.instruction.text_digest","adapter_transported_prompt_without_mutation(production_prompt.rendered_prompt_digest)","purpose_specific_independent_measurement(","evidence_includes_fresh_builder_verification_and_complete_black_box_grade(evidence)"],"ensures":["candidate.status = measured","candidate.executed_prompt_digest = production_prompt.rendered_prompt_digest","candidate.independent_score = score","candidate.metric_evidence = evidence"]},{"name":"SelectWinningInstruction","source":"rule SelectWinningInstruction {\n    when: OrcSelectedInstructionWinner(optimization, winner)\n    requires: optimization.status = evaluating\n    requires: winner.optimization = optimization\n    requires: winner.status = measured\n    requires: winner.instruction.purpose = optimization.purpose\n    requires: winner.independent_score = highest_measured_score(optimization)\n    ensures: prior_active_instruction_deactivated(optimization.purpose)\n    ensures: winner.status = selected\n    ensures: winner.instruction.active = true\n    ensures: optimization.winning_instruction = winner.instruction\n    ensures: optimization.status = optimized\n    ensures: durable_instruction_activation_recorded(\n        optimization.purpose,\n        winner.instruction.identity,\n        winner.instruction.text_digest\n    )\n}","when":"OrcSelectedInstructionWinner(optimization, winner)","requires":["optimization.status = evaluating","winner.optimization = optimization","winner.status = measured","winner.instruction.purpose = optimization.purpose","winner.independent_score = highest_measured_score(optimization)"],"ensures":["prior_active_instruction_deactivated(optimization.purpose)","winner.status = selected","winner.instruction.active = true","optimization.winning_instruction = winner.instruction","optimization.status = optimized","durable_instruction_activation_recorded("]},{"name":"FailPromptOptimization","source":"rule FailPromptOptimization {\n    when: NoMeasuredInstructionWinner(optimization, reason)\n    requires: optimization.status = evaluating\n    ensures: optimization.status = failed\n    ensures: PromptOptimizationFailureRecorded(optimization: optimization, reason: reason)\n}","when":"NoMeasuredInstructionWinner(optimization, reason)","requires":["optimization.status = evaluating"],"ensures":["optimization.status = failed","PromptOptimizationFailureRecorded(optimization: optimization, reason: reason)"]}],"id":"prompt-optimization","openQuestions":[],"invariants":[{"name":"ActiveInstructionWasIndependentlySelected","source":"invariant ActiveInstructionWasIndependentlySelected {\n    for instruction in BuilderInstructions:\n        instruction.active implies\n            exists InstructionCandidate{instruction: instruction, status: selected}\n}"},{"name":"OneActiveInstructionPerPurpose","source":"invariant OneActiveInstructionPerPurpose {\n    for purpose in BuilderInstructionPurposes:\n        active_instructions(purpose).count <= 1\n}"},{"name":"CompleteStrategyIsTheOptimizationUnit","source":"invariant CompleteStrategyIsTheOptimizationUnit {\n    for candidate in InstructionCandidates:\n        candidate.instruction = complete_model_directed_strategy(candidate.instruction.purpose)\n        and no_adapter_appends_model_directed_instructions(candidate)\n}"},{"name":"OrcOwnsEveryProductionPrompt","source":"invariant OrcOwnsEveryProductionPrompt {\n    for prompt in ProductionPrompts:\n        prompt.system_instruction_digest = orc_owned_system_instruction_digest(prompt.role)\n        and prompt.task_instruction_digest = orc_owned_task_instruction_digest(prompt.role)\n        and no_adapter_constructs_or_appends_production_prompt_text(prompt)\n}"},{"name":"EnforcementDoesNotDependOnPromptCompliance","source":"invariant EnforcementDoesNotDependOnPromptCompliance {\n    for prompt in ProductionPrompts:\n        workspace_scope_network_credentials_stack_compose_health_tests_and_evidence_are_enforced_outside_prompt(prompt)\n}"},{"name":"PurposeSpecificMeasurement","source":"invariant PurposeSpecificMeasurement {\n    for candidate in InstructionCandidates:\n        candidate.status = measured implies\n            measurement_isolated_to_instruction_purpose(\n                candidate.instruction.purpose,\n                candidate.metric_evidence\n            )\n}"},{"name":"BuilderCannotAuthorPromptMetric","source":"invariant BuilderCannotAuthorPromptMetric {\n    for candidate in InstructionCandidates:\n        candidate.status = measured implies independent_metric(candidate.metric_evidence)\n}"},{"name":"ReflectionProvenanceIsDurable","source":"invariant ReflectionProvenanceIsDurable {\n    for candidate in InstructionCandidates:\n        candidate.proposal_call_digest != \"\"\n        and candidate.optimization.reflection.provider = \"bedrock\"\n        and candidate.optimization.reflection.model != \"\"\n}"}]},{"description":"Observable behavior of the session-hosted ORC regeneration workflow. Product behavior belongs to model/<project>; ORC runtime behavior belongs to ORC. End of observable regeneration-cycle contract.","featureFile":"model/pi-harness/regeneration-cycle.feature","file":"model/pi-harness/regeneration-cycle.allium","surfaces":[{"name":"RegenerationHarness","source":"surface RegenerationHarness {\n    facing operator: OperatorSession\n\n    provides:\n        PrepareRegenerationCut(operator, source_commit, backend)\n        ComposeSystemView(operator, cut)\n        ProposeSliceSelection(operator, cut, project_identity, operator_intent)\n        PreviewSliceSelection(operator, cut, project_identity, slice_identity, requested_items)\n        ApproveSliceSelection(operator, selection, digest)\n        PrepareRegenerationCycle(operator, preparation_identity, selection, scope,\n                                 target_stack, execution_profile, cut_digest,\n                                 oracle_digest, diagram_digest, max_outer_cycles)\n        ApproveCyclePreparation(operator, preparation, digest)\n        SubmitRegenerationCycle(operator, request_identity, preparation, parent_cycle_identity)\n        ObserveBuilderSession(operator, builder_session)\n\n    @guarantee BuilderIsolation\n        -- The builder reads a fenced cut, writes only the declared scope, and does not inherit the operator transcript.\n\n    @guarantee CalibratedBuilder\n        -- No builder starts until a fresh harness snapshot covers the complete committed harness,\n        -- binds every runtime asset, and passes carried and uncarried normalized Allure goldens;\n        -- independently, the product oracle supplies digest-matched approved expected evidence per item.\n\n    @guarantee IndependentMeasurement\n        -- The builder cannot author the oracle, verifier, evidence collector, comparator, or final measurement used to pass its cycle.\n\n    @guarantee InconclusiveDoesNotPass\n        -- Missing or incomplete required runtime evidence remains in the denominator\n        -- and cannot be interpreted as a passing item.\n\n    @guarantee HonestDenominator\n        -- Missing or unreached items fail and remain in the approved denominator.\n}","facing":"operator","provides":["PrepareRegenerationCut","ComposeSystemView","ProposeSliceSelection","PreviewSliceSelection","ApproveSliceSelection","PrepareRegenerationCycle","ApproveCyclePreparation","SubmitRegenerationCycle","ObserveBuilderSession"]}],"entities":[{"name":"RegenerationCut","source":"entity RegenerationCut {\n    identity: String\n    source_commit: SourceCommit\n    tree_digest: Digest\n    backend: ExecutionBackend\n    fenced: Boolean\n}","external":false},{"name":"SelectionItem","source":"entity SelectionItem {\n    identity: String\n    scenario_digest: Digest\n    name: String\n    rule_name: String\n    source: String\n}","external":false},{"name":"SliceSelection","source":"entity SliceSelection {\n    identity: String\n    digest: Digest\n    status: SelectionStatus\n    cut: RegenerationCut\n    project_identity: String\n    container_identity: String\n    component_identity: String\n    slice_identity: String\n    items: List<SelectionItem>\n\n    transitions status {\n        awaiting_approval -> approved\n        terminal: approved\n    }\n}","external":false},{"name":"SystemComposition","source":"entity SystemComposition {\n    cut: RegenerationCut\n    digest: Digest\n    slice_mappings: List<String>\n}","external":false},{"name":"CyclePreparation","source":"entity CyclePreparation {\n    identity: String\n    digest: Digest\n    status: PreparationStatus\n    selection: SliceSelection\n    scope: CandidateScope\n    target_stack: String\n    execution_profile: ExecutionProfile\n    cut_digest: Digest\n    oracle_digest: Digest\n    diagram_digest: Digest\n    max_outer_cycles: Integer\n\n    transitions status {\n        awaiting_approval -> approved\n        terminal: approved\n    }\n}","external":false},{"name":"RegenerationCycle","source":"entity RegenerationCycle {\n    identity: String\n    preparation: CyclePreparation\n    parent_cycle_identity: String?\n    status: CycleStatus\n    candidate_digest: Digest?\n\n    transitions status {\n        submitted -> running\n        running -> passed\n        running -> failed\n        terminal: passed, failed\n    }\n\n    observations: ItemObservation with cycle = this\n    measurement: CycleMeasurement with cycle = this\n}","external":false},{"name":"BuilderSession","source":"entity BuilderSession {\n    identity: String\n    cycle: RegenerationCycle\n    operation_identity: String\n    stage: String\n    attempt: Integer\n    status: BuilderSessionStatus\n    workspace_generation: String?\n    assisted: Boolean\n}","external":false},{"name":"HarnessCalibration","source":"entity HarnessCalibration {\n    cycle: RegenerationCycle\n    harness_snapshot_digest: Digest\n    harness_source_digest: Digest\n    carried_fixture_passed: Boolean\n    uncarried_fixture_passed: Boolean\n}","external":false},{"name":"ItemObservation","source":"entity ItemObservation {\n    cycle: RegenerationCycle\n    item: SelectionItem\n    producer: String\n    authority: ProducerAuthority\n    evidence_purpose: EvidencePurpose\n    verdict: Verdict\n    reached: Boolean\n    evidence: String\n    subject_digest: Digest\n    oracle_digest: Digest\n}","external":false},{"name":"CycleMeasurement","source":"entity CycleMeasurement {\n    cycle: RegenerationCycle\n    total: Integer\n    passed: Integer\n    failed: Integer\n    complete: Boolean\n    item_results: List<ItemObservation>\n}","external":false},{"name":"CollectedProductEvidence","source":"entity CollectedProductEvidence {\n    cycle: RegenerationCycle\n    subject_digest: Digest\n    evidence_digest: Digest\n    complete: Boolean\n}","external":false},{"name":"OperatorSession","source":"external entity OperatorSession {}\n\nenum ExecutionBackend { host | gondolin }\nenum SelectionStatus { awaiting_approval | approved }\nenum PreparationStatus { awaiting_approval | approved }\nenum ExecutionProfile { host_development | gondolin_isolated | automatic }\nenum CycleStatus { submitted | running | passed | failed }\nenum BuilderSessionStatus { opening | active | paused | completed | failed }\nenum Verdict { pass | fail | inconclusive }\nenum ProducerAuthority { candidate | harness_observer | independent_validator }\nenum EvidencePurpose { assertion | diagnostic | calibration }\n\nvalue Digest { value: String }\nvalue SourceCommit { value: String }\nvalue CandidateScope { paths: List<String> }\n\nentity RegenerationCut {\n    identity: String\n    source_commit: SourceCommit\n    tree_digest: Digest\n    backend: ExecutionBackend\n    fenced: Boolean\n}","external":true}],"rules":[{"name":"PrepareCut","source":"rule PrepareCut {\n    when: PrepareRegenerationCut(operator, source_commit, backend)\n    ensures: RegenerationCut.created(\n        identity: prepared_cut_identity(source_commit, backend),\n        source_commit: source_commit,\n        tree_digest: fenced_tree_digest(source_commit),\n        backend: backend,\n        fenced: true\n    )\n}","when":"PrepareRegenerationCut(operator, source_commit, backend)","req
