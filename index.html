(operator, cut, project_identity, slice_identity, requested_items)","requires":["cut.fenced","slice_identity in valid_system_composition(cut)","resolved_items.count > 0"],"ensures":["SliceSelection.created("]},{"name":"ProposeSelectionFromIntent","source":"rule ProposeSelectionFromIntent {\n    when: ProposeSliceSelection(operator, cut, project_identity, operator_intent)\n    requires: cut.fenced\n    let proposed_scope = llm_propose_existing_slice_and_items(\n        cut, project_identity, operator_intent)\n    requires: proposed_scope.belongs_to(valid_system_composition(cut))\n    let resolved_items = resolve_items(\n        cut, project_identity, proposed_scope.slice_identity, proposed_scope.item_identities)\n    requires: resolved_items.count > 0\n    ensures: SliceSelection.created(\n        identity: deterministic_selection_identity(\n            cut, project_identity, proposed_scope.slice_identity, resolved_items),\n        digest: deterministic_selection_digest(\n            cut, project_identity, proposed_scope.slice_identity, resolved_items),\n        status: awaiting_approval,\n        cut: cut,\n        project_identity: project_identity,\n        container_identity: container_for(cut, proposed_scope.slice_identity),\n        component_identity: component_for(cut, proposed_scope.slice_identity),\n        slice_identity: proposed_scope.slice_identity,\n        items: resolved_items\n    )\n}","when":"ProposeSliceSelection(operator, cut, project_identity, operator_intent)","requires":["cut.fenced","proposed_scope.belongs_to(valid_system_composition(cut))","resolved_items.count > 0"],"ensures":["SliceSelection.created("]},{"name":"ApproveSelection","source":"rule ApproveSelection {\n    when: ApproveSliceSelection(operator, selection, digest)\n    requires: selection.status = awaiting_approval\n    requires: digest = selection.digest\n    ensures: selection.status = approved\n}","when":"ApproveSliceSelection(operator, selection, digest)","requires":["selection.status = awaiting_approval","digest = selection.digest"],"ensures":["selection.status = approved"]},{"name":"PrepareCycle","source":"rule PrepareCycle {\n    when: PrepareRegenerationCycle(operator, preparation_identity, selection, scope,\n                                   target_stack, execution_profile, cut_digest,\n                                   oracle_digest, diagram_digest, max_outer_cycles)\n    requires: selection.status = approved\n    requires: scope_is_safe(scope)\n    requires: max_outer_cycles > 0\n    ensures: CyclePreparation.created(\n        identity: preparation_identity,\n        digest: deterministic_preparation_digest(\n            selection, scope, target_stack, execution_profile, cut_digest,\n            oracle_digest, diagram_digest, max_outer_cycles),\n        status: awaiting_approval,\n        selection: selection,\n        scope: scope,\n        target_stack: target_stack,\n        execution_profile: execution_profile,\n        cut_digest: cut_digest,\n        oracle_digest: oracle_digest,\n        diagram_digest: diagram_digest,\n        max_outer_cycles: max_outer_cycles\n    )\n}","when":"PrepareRegenerationCycle(operator, preparation_identity, selection, scope,","requires":["selection.status = approved","scope_is_safe(scope)","max_outer_cycles > 0"],"ensures":["CyclePreparation.created("]},{"name":"ApprovePreparation","source":"rule ApprovePreparation {\n    when: ApproveCyclePreparation(operator, preparation, digest)\n    requires: preparation.status = awaiting_approval\n    requires: digest = preparation.digest\n    ensures: preparation.status = approved\n}","when":"ApproveCyclePreparation(operator, preparation, digest)","requires":["preparation.status = awaiting_approval","digest = preparation.digest"],"ensures":["preparation.status = approved"]},{"name":"SubmitCycle","source":"rule SubmitCycle {\n    when: SubmitRegenerationCycle(operator, request_identity, preparation, parent_cycle_identity)\n    requires: preparation.status = approved\n    requires: preparation.selection.items.count > 0\n    requires: not exists RegenerationCycle{identity: request_identity}\n    ensures: RegenerationCycle.created(\n        identity: request_identity,\n        preparation: preparation,\n        parent_cycle_identity: parent_cycle_identity,\n        status: submitted,\n        candidate_digest: null\n    )\n}","when":"SubmitRegenerationCycle(operator, request_identity, preparation, parent_cycle_identity)","requires":["preparation.status = approved","preparation.selection.items.count > 0","not exists RegenerationCycle{identity: request_identity}"],"ensures":["RegenerationCycle.created("]},{"name":"StartCycle","source":"rule StartCycle {\n    when: StartRegenerationCycle(cycle)\n    requires: cycle.status = submitted\n    ensures: cycle.status = running\n    ensures: ValidatePinnedContract(cycle: cycle)\n}","when":"StartRegenerationCycle(cycle)","requires":["cycle.status = submitted"],"ensures":["cycle.status = running","ValidatePinnedContract(cycle: cycle)"]},{"name":"CalibrateHarnessAndBuildCandidate","source":"rule CalibrateHarnessAndBuildCandidate {\n    when: PinnedContractValidated(cycle, product_contract_digest,\n                                  harness_snapshot_digest, harness_source_digest)\n    requires: cycle.status = running\n    requires: cycle.preparation.selection.cut.fenced\n    requires: fresh_harness_snapshot_sealed(harness_snapshot_digest)\n    requires: complete_harness_snapshot_component_coverage(harness_snapshot_digest)\n    requires: product_oracle_resolved_by_descriptor_digest(cycle)\n    requires: product_oracle_contains_selected_items_exactly_once(cycle)\n    requires: cycle.preparation.selection.items.all(item =>\n        product_oracle_has_approved_expected_evidence(\n            cycle, item.identity, item.scenario_digest))\n    requires: harness_source_digest = discovered_complete_harness_source_digest(cycle)\n    requires: normalized_carried_golden_passed(harness_snapshot tionRequested(cycle_identity, capture_policy, evidence_volume)\n        BaselineGradeCompleted(cycle_identity, evaluation, trace)\n\n    @guarantee IndependentVerdictAuthority\n        -- Candidate telemetry may supply correlated facts but cannot author the\n        -- independent invariant verdict used by the cycle measurement.\n\n    @guarantee IncompleteMeansInconclusive\n        -- Missing, incomplete, sampled, or dropped required signals record their affected\n        -- kind and reason and cannot silently pass or fail.\n\n    @guarantee DurableBeforeProjection\n        -- Reports reproduce a persisted evidence digest and never become verdict authority.\n\n    @guarantee IsolatedCycleEvidence\n        -- Independent validation writes only to one cycle-owned evidence volume; the\n        -- candidate and instrument-OCI-supplied declarative capture policy remain read-only.\n\n    @guarantee BaselineTraceIsBound\n        -- A passing first grade is promotable only when its genuine Playwright trace exists,\n        -- is complete, and its digest is part of the normalized proposal evidence.\n}","facing":null,"provides":["RuntimeSignalCaptured","IndependentInvariantChecked","IndependentInvariantInputsIncomplete","RuntimeEvidenceReportRequested","IndependentValidationRequested","BaselineGradeCompleted"]}],"entities":[{"name":"RuntimeSignal","source":"entity RuntimeSignal {\n    identity: String\n    cycle_identity: String\n    item_identity: String?\n    operation_identity: String?\n    trace_identity: String?\n    event_identity: String?\n    kind: RuntimeSignalKind\n    producer: String\n    authority: ProducerAuthority\n    purpose: EvidencePurpose\n    subject_digest: RuntimeDigest\n    content_digest: RuntimeDigest\n    complete: Boolean\n    sampled: Boolean\n    dropped_count: Integer\n    collection_reason: String?\n}","external":false},{"name":"IndependentInvariantEvaluation","source":"entity IndependentInvariantEvaluation {\n    identity: String\n    cycle_i "requires":["signal.identity != \"\"","signal.cycle_identity != \"\"","signal.producer != \"\"","signal.dropped_count >= 0"],"ensures":["RuntimeSignal.created("]},{"name":"EvaluateCompleteInvariant","source":"rule EvaluateCompleteInvariant {\n    when: IndependentInvariantChecked(cycle_identity, item_identity, invariant_identity,\n                                      producer, subject_digest, signals, verdict, evidence_digest)\n    requires: signals.count > 0\n    requires: signals.all(signal => signal.cycle_identity = cycle_identity)\n    requires: signals.all(signal => signal.subject_digest = subject_digest)\n    requires: signals.all(signal => signal.complete)\n    requires: signals.all(signal => not signal.sampled)\n    requires: signals.all(signal => signal.dropped_count = 0)\n    requires: verdict = pass or verdict = fail\n    ensures: IndependentInvariantEvaluation.created(\n        identity: invariant_evaluation_identity(cycle_identity, item_identity, invariant_identity),\n        cycle_identity: cycle_identity,\n        item_identity: item_identity,\n        invariant_identity: invariant_identity,\n        producer: producer,\n        authority: independent_validator,\n        input_signals: signals,\n        subject_digest: subject_digest,\n        verdict: verdict,\n        evidence_digest: evidence_digest\n    )\n}","when":"IndependentInvariantChecked(cycle_identity, item_identity, invariant_identity,","requires":["signals.count > 0","signals.all(signal => signal.cycle_identity = cycle_identity)","signals.all(signal => signal.subject_digest = subject_digest)","signals.all(signal => signal.complete)","signals.all(signal => not signal.sampled)","signals.all(signal => signal.dropped_count = 0)","verdict = pass or verdict = fail"],"ensures":["IndependentInvariantEvaluation.created("]},{"name":"MarkIncompleteInvariantInconclusive","source":"rule MarkIncompleteInvariantInconclusive {\n    when: IndependentInvariantInputsIncomplete(cycle_identity, item_identity, invariant_identity,\n                                               producer, subject_digest, signals, evidence_digest)\n    requires: signals.count = 0 or\n        exists signals where not complete or sampled or dropped_count > 0\n    requires: incomplete_collection_reason(signals) != \"\"\n    ensures: IndependentInvariantEvaluation.created(\n        identity: invariant_evaluation_identity(cycle_identity, item_identity, invariant_identity),\n        cycle_identity: cycle_identity,\n        item_identity: item_identity,\n        invariant_identity: invariant_identity,\n        producer: producer,\n        authority: independent_validator,\n        input_signals: signals,\n        subject_digest: subject_digest,\n        verdict: inconclusive,\n        evidence_digest: evidence_digest\n    )\n}","when":"IndependentInvariantInputsIncomplete(cycle_identity, item_identity, invariant_identity,","requires":["signals.count = 0 or","incomplete_collection_reason(signals) != \"\""],"ensures":["IndependentInvariantEvaluation.created("]},{"name":"ProjectRuntimeEvidence","source":"rule ProjectRuntimeEvidence {\n    when: RuntimeEvidenceReportRequested(evaluation)\n    ensures: EvidenceProjectionCreated(\n        evaluation_identity: evaluation.identity,\n        verdict: evaluation.verdict,\n        evidence_digest: evaluation.evidence_digest\n    )\n}","when":"RuntimeEvidenceReportRequested(evaluation)","requires":[],"ensures":["EvidenceProjectionCreated("]},{"name":"OpenIndependentValidationRoom","source":"rule OpenIndependentValidationRoom {\n    when: IndependentValidationRequested(cycle_identity, capture_policy, evidence_volume)\n    requires: capture_policy.read_only\n    requires: capture_policy.mount_path = \"/observability\"\n    requires: evidence_volume.cycle_identity = cycle_identity\n    requires: evidence_volume.mount_path = \"/evidence\"\n    requires: evidence_volume.writable\n    ensures: IndependentValidationRoomOpened(\n        cycle_identity: cycle_identity,\n        capture_policy: capture_policy,\n        evidence_volume: evidence_volume\n    )\n}","when":"IndependentValidationRequested(cycle_identity, capture_policy, evidence_volume)","requires":["capture_policy.read_only","capture_policy.mount_path = \"/observability\"","evidence_volume.cycle_identity = cycle_identity","evidence_volume.mount_path = \"/evidence\"","evidence_volume.writable"],"ensures":["IndependentValidationRoomOpened("]},{"name":"BindSuccessfulBaselineTrace","source":"rule BindSuccessfulBaselineTrace {\n    when: BaselineGradeCompleted(cycle_identity, evaluation, trace)\n    requires: evaluation.verdict = pass\n    requires: trace.cycle_identity = cycle_identity\n    requires: trace.path = \"playwright/baseline/trace.zip\"\n    requires: trace.complete\n    requires: trace.authority = independent_validator\n    ensures: NormalizedEvidenceProposalBound(\n        cycle_identity: cycle_identity,\n        evidence_digest: evaluation.evidence_digest,\n        browser_trace_digest: trace.content_digest\n    )\n}","when":"BaselineGradeCompleted(cycle_identity, evaluation, trace)","requires":["evaluation.verdict = pass","trace.cycle_identity = cycle_identity","trace.path = \"playwright/baseline/trace.zip\"","trace.complete","trace.authority = independent_validator"],"ensures":["NormalizedEvidenceProposalBound("]}],"id":"runtime-evidence","openQuestions":[],"invariants":[{"name":"CandidateCannotAuthorIndependentVerdict","source":"invariant CandidateCannotAuthorIndependentVerdict {\n    for evaluation in IndependentInvariantEvaluations:\n        evaluation.authority = independent_validator\n}"},{"name":"PassingEvaluationRequiresCompleteCollection","source":"invariant PassingEvaluationRequiresCompleteCollection {\n    for evaluation in IndependentInvariantEvaluations:\n        evaluation.verdict = pass implies\n            evaluation.input_signals.count > 0 and\n            evaluation.input_signals.all(signal =>\n                signal.complete and not signal.sampled and signal.dropped_count = 0)\n}"},{"name":"DiagnosticSignalCannotDetermineVerdict","source":"invariant DiagnosticSignalCannotDetermineVerdict {\n    for signal in RuntimeSignals:\n        signal.purpose = diagnostic implies\n            not exists IndependentInvariantEvaluations where evidence_digest = signal.content_digest\n}"},{"name":"EvidenceProjectionIsNotAuthority","source":"invariant EvidenceProjectionIsNotAuthority {\n    for evaluation in IndependentInvariantEvaluations:\n        projected_verdict(evaluation.identity) = evaluation.verdict\n}"},{"name":"ValidationEvidenceIsCycleIsolated","source":"invariant ValidationEvidenceIsCycleIsolated {\n    for volume in CycleEvidenceVolumes:\n        volume.identity = cycle_evidence_volume_identity(volume.cycle_identity)\n}"},{"name":"OtelCapturePolicyIsPinnedReadOnlyInput","source":"invariant OtelCapturePolicyIsPinnedReadOnlyInput {\n    for capture_policy in OtelCapturePolicies:\n        capture_policy.read_only and capture_policy.mount_path = \"/observability\"\n}"},{"name":"PassingBaselineRequiresPlaywrightTrace","source":"invariant PassingBaselineRequiresPlaywrightTrace {\n    for evaluation in IndependentInvariantEvaluations:\n        evaluation.verdict = pass implies\n            exists BrowserTraceArtifacts where\n                cycle_identity = evaluation.cycle_identity and\n                path = \"playwright/baseline/trace.zip\" and\n                complete and\n                authority = independent_validator\n}"}]}],"eventModel":{"commands":{"loyly.pi-harness/approve-cycle-preparation":{"description":"Approve only the exact digest of a recorded cycle preparation.","grain/allium":[{"kind":"rule","name":"ApprovePreparation","spec":"model/pi-harness/regeneration-cycle.allium"}],"produces":["loyly.pi-harness/cycle-preparation-approved"],"reads":["loyly.pi-harness/cycle-preparations"],"schema":["map",["preparation-id","string"],["preparation-digest","string"]]},"loyly.pi-harness/approve-oracle ge","And before the builder starts ORC verifies the fresh sealed harness snapshot","And every verdict-affecting harness component, runtime asset, and the complete harness revision match its manifest","And normalized carried and uncarried Allure goldens pass","And any calibration mismatch prevents the builder stage"]},{"file":"model/pi-harness/execution-pipeline.feature","module":"execution-pipeline","rule":"ORC owns the complete ordered execution pipeline","title":"ORC exposes the declared regeneration stage order","item":"01-024","status":"skip","tags":["@item-01-024","@skip"],"steps":["Given the Pi harness ORC worker is running","When Pi requests the executable regeneration workflow contract","Then ORC exposes these stages in order:"]},{"file":"model/pi-harness/execution-pipeline.feature","module":"execution-pipeline","rule":"ORC owns the complete ordered execution pipeline","title":"A slice without a human affordance contract does not invent a UI","item":"01-024","status":"skip","tags":["@item-01-024","@skip"],"steps":["Given the approved slice is not selected by the project's affordance contract","When independent affordance conformance runs","Then it records a passed non-applicable result with zero checks","And verification continues without requiring screens or forms"]},{"file":"model/pi-harness/execution-pipeline.feature","module":"execution-pipeline","rule":"ORC owns the complete ordered execution pipeline","title":"Instrumentation records the subject without changing it","item":"01-025","status":"skip","tags":["@item-01-025","@skip"],"steps":["Given the builder produced a candidate with a subject digest","When the instrument stage runs","Then it records the subject digest and evidence locations","And the candidate content digest remains unchanged"]},{"file":"model/pi-harness/execution-pipeline.feature","module":"execution-pipeline","rule":"ORC owns the complete ordered execution pipeline","title":"The whole-system product oracle supplies approved expected evidence","item":"01-026","status":"skip","tags":["@item-01-026","@skip"],"steps":["Given an approved selection names stable item identities and full Gherkin scenario digests","When harness calibration resolves its product-oracle OCI before the builder starts","Then the immutable descriptor contains every selected item exactly once","And every selected entry matches the full scenario digest and contains manually approved normalized expected evidence","And unselected catalogue entries do not enter the approved denominator","And the product oracle need not match the source tree or name the harness snapshot","And cycle evidence records the independently resolved product descriptor and sealed harness snapshot digest","And any missing, duplicate, or scenario-digest-mismatched selected item prevents the builder from starting"]},{"file":"model/pi-harness/execution-pipeline.feature","module":"execution-pipeline","rule":"Independent rooms and evidence preserve provenance","title":"Evidence identity cannot be reused for different content","item":"01-028","status":"skip","tags":["@item-01-028","@skip"],"steps":["Given an observation exists for one cycle, item, kind, and producer","When different evidence is recorded with that identity","Then recording is refused as a conflict","And the original observation remains authoritative"]},{"file":"model/pi-harness/execution-pipeline.feature","module":"execution-pipeline","rule":"Independent rooms and evidence preserve provenance","title":"Evidence reports are derived projections","item":"01-029","status":"skip","tags":["@item-01-029","@skip"],"steps":["Given a validated observation was recorded","When an Allure or other report is emitted","Then the report preserves the observation identity, verdict, reachability, and provenance","And changing or losing the report cannot change the recorded measurement"]},{"file":"model/pi-harness/execution-pipeline.feature","module":"execution-pipeline","rule":"Non-success outcomes remain explicit and
