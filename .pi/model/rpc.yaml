# The Pi harness's public seam: JSON-RPC over stdio. This is the interface Pi and an
# operator drive, the gate's identity probe uses, and a grader drives. It names no
# implementation; any harness that speaks it is driven the same way.
seam: json-rpc-over-stdio
framing:
  request: "one JSON object per line on stdin: {id, method, params}"
  response: "one JSON object per line on stdout: {id, ok: true, result} or {id, ok: false, error}"
  rule: "every request gets exactly one response carrying its id; nothing else is written to stdout"
start: "APP_DIR/start.sh starts the harness reading stdin and writing stdout until stdin closes"
methods:
  cycle-contract:
    params: {}
    result: {workflowName: "string naming the harness", stages: [fence, regenerate, gate, score, scoreboard]}
  workflow-contract:
    params: {}
    result: {workflowName: string, routes: "list of slice-cycle routes", rootType: string, stages: "list of slice-cycle stage names", builderResultFields: "field names of a builder result, including builderSessionId", proposalResultFields: "field names of an oracle proposal", observationFields: "field names of an observation, including artifacts"}
    rule: "the executable regeneration workflow contract: what a slice cycle's builder results and observations carry, read from the workflow itself"
  submit-cycle:
    params: {requestId: "safe identifier"}
    result: {cycleId: requestId, tickId: string, taskId: integer}
    rule: "repeating a requestId returns the original receipt"
    selection: >-
      submit-cycle takes no selection. It regenerates the whole plan of the pinned cut, and that
      whole-plan selection is the approved selection of the cycle, as in the legacy shape. A
      partial selection is previewed, approved by exact digest, and submitted as a slice cycle
      (submit-approved-slice); an unapproved partial selection is refused there, never here.
  wait:
    params: {taskId: integer}
    result: {status: "completed | failed", error: "string when failed", result: "stage outputs"}
  execution-status:
    params: {tickId: string}
    result: {tickId: string, status: "not-started | running | completed | failed", stage: "string when known", attempt: "integer when known", builderSessionRef: "string when a builder is running"}

  # The cut and partial selections (slices 01, 04). A partial selection is previewed, approved
  # by exact digest, and only then submitted as a slice cycle. Selections are made over the
  # product slices inside a prepared cut.
  prepare-cut:
    params: {sourceCommit: "40-hex commit", executionBackend: "host | gondolin"}
    result: {cutId: "the request's identity (the source commit)", taskId: integer, executionBackend: string}
    outcome: >-
      wait(taskId) completes with the prepared cut; its identity, the one slice-composition and
      preview-selection accept, is result.outputs.cut-result.cutId. The receipt's cutId is not a
      prepared cut.
    rule: "an invalid or colliding identity is refused before any cut is written"
  slice-composition:
    params: {cut: "a prepared cut's identity"}
    result: "the cut's product slices, each named by its bare directory (NN-slug), with their stamped items as full tags (@item-NN-SSS)"
  preview-selection:
    params: {cut: "a prepared cut's identity", slice: "bare slice directory name, NN-slug", itemIds: "optional list of full item tags (@item-NN-SSS) as slice-composition returns them; omitted or empty selects the whole slice"}
    result: {selectionId: string, selectionDigest: string, status: "awaiting-approval", items: "list of full item tags"}
    rule: "previewing the same slice and items again returns the same selectionId and selectionDigest; an empty or ambiguous denominator is refused and nothing is recorded"
  approve-selection:
    params: {selectionId: string, selectionDigest: string}
    result: {selectionId: string, selectionDigest: string, status: "approved"}
    rule: "a digest other than the reviewed one is refused and the selection stays awaiting approval"
  submit-approved-slice:
    params: {requestId: string, selectionId: string, scope: "list of candidate paths", targetStack: string, executionBackend: "host | gondolin"}
    result: {operationId: string, selectionId: string, tickId: string, correlationId: string, taskId: integer, targetStack: string, executionBackend: string}
    rule: "an unapproved selection or an unsafe scope is refused before a builder starts; repeating a requestId returns the original receipt"

  # The instrument (slice 03). Only an operator approves a sealed grader, by its exact digest.
  approve-grader:
    params: {graderDigest: "sha256:<hex> of a sealed, calibrated grader", approvedBy: string}
    result: {graderDigest: string, approvedBy: string, items: "list of item ids the grader covers"}
    rule: "a digest that names no sealed grader is refused; a cycle never scores without an approved grader"
  measurement:
    params: {cycleId: string}
    result: "the cycle's filed verdicts against its full denominator, or null when no score was filed"

  # Builder sessions (slice 04). Observation is read-only.
  builder-session:
    params: {builderSessionRef: string}
    result: {builderSessionRef: string, status: "running | completed | failed", entries: "committed turns and tool results", toolCalls: integer, workspaceGeneration: "list of top-level paths", progress: {stage: string, attempt: integer}}
    rule: "reading a session changes neither its transcript nor its candidate"

  # Prompt optimization (slice 06).
  optimize-prompt:
    params: {purpose: "fresh-generation | verification-repair", reflectionProvider: string, reflectionModel: string, trainset: "non-empty list", valset: "non-empty list"}
    result: "the winning instruction for the purpose with its independently measured score"
    rule: "missing training or validation examples are refused"
errors:
  unknown-method: "{id, ok: false, error} naming the method"
  refused: "{id, ok: false, error} naming what was refused and why; the harness keeps running"
